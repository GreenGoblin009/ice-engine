html{background:#0A0E14; color-scheme:dark;}

<script>
/* ============ CONFIG ============ */
const SB_URL = 'https://fjdakfbvdnolidmgnagr.supabase.co';
const SB_KEY = 'sb_publishable_IhfYW8SO7YM_8xdx9MWhVA_qlRM_uAc';
const CUR = 20262027, PREV = 20252026;
const GREEN_LIGHT = 3.35;       // projected team goals at/above this = green light
const PRIOR_GAMES = 15;         // weight (in games) given to last season's rate
const LEAGUE_AVG = 3.05;
const LEAGUE_SV = 0.905;
const PRICE_FLOOR = -140;       // best available Points/Assists price worse than this is hidden
const MARKET_STAT = {player_points:'Points', player_assists:'Assists', player_goal_scorer_anytime:'Goals', player_shots_on_goal:'Shots'};
const FLOOR_BY_STAT = {Points:-140, Assists:-140, Goals:-160, Shots:-160};
const SHRINK_K = 10;           // hit-rate shrink toward the pool rate (in games)
const MIN_PLAY_HIT = 0.583;     // break-even of -140, your worst allowed price for points/assists

const TEAM_COLORS={ANA:'#F47A38',BOS:'#111111',BUF:'#002654',CGY:'#D2001C',CAR:'#CC0000',CHI:'#CF0A2C',COL:'#6F263D',CBJ:'#002654',DAL:'#006847',DET:'#CE1126',EDM:'#FF4C00',FLA:'#C8102E',LAK:'#111111',MIN:'#154734',MTL:'#AF1E2D',NSH:'#FFB81C',NJD:'#CE1126',NYI:'#00539B',NYR:'#0038A8',OTT:'#C52032',PHI:'#F74902',PIT:'#000000',SJS:'#006D75',SEA:'#355464',STL:'#002F87',TBL:'#002868',TOR:'#00205B',UTA:'#71AFE5',VAN:'#00205B',VGK:'#B4975A',WSH:'#C8102E',WPG:'#041E42'};
const TEAM_STRIPE={BUF:'#FFB81C', CBJ:'#CE1126', TOR:'#FFFFFF', FLA:'#FDBB30', CAR:'#FFFFFF', TBL:'#FFFFFF', BOS:'#FFB81C', DET:'#FFFFFF', MTL:'#FFFFFF', NJD:'#FFFFFF', NYR:'#CE1126', PIT:'#FFB81C', NYI:'#F47D30', PHI:'#FFFFFF', WSH:'#FFFFFF', OTT:'#FFFFFF', COL:'#236192', DAL:'#006847', MIN:'#A6192E', WPG:'#7B303E', UTA:'#69B3E7', NSH:'#FFB81C', STL:'#FCB514', CHI:'#FFFFFF', EDM:'#FF4C00', VGK:'#B4975A', ANA:'#F47A38', CGY:'#D2001C', LAK:'#A2AAAD', SJS:'#EA7200', SEA:'#99D9D9', VAN:'#00205B'};
const teamColor=t=>TEAM_COLORS[(t||'').toUpperCase()]||'#3A4658';
const stripeColor=t=>TEAM_STRIPE[(t||'').toUpperCase()]||'#FFFFFF';

const STATS = {
  Points:{col:'points', line:0.5}, Goals:{col:'goals', line:0.5}, Assists:{col:'assists', line:0.5},
  Shots:{col:'sog', line:2.5}, 'Shot Attempts':{col:'shot_attempts', line:4.5}
};

/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function etToday(){ return new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'}); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000); }
function fmtOdds(o){ return (o>0?'+':'')+Math.round(o); }
function fairOdds(p){ if(p<=0) return null; if(p>=1) return -10000; return p>=0.5 ? -Math.round(p/(1-p)*100) : Math.round((1-p)/p*100); }
function impliedProb(o){ return o<0 ? (-o)/((-o)+100) : 100/(o+100); }
function fmtDate(d){ const [y,m,dd]=d.split('-'); return `${+m}/${+dd}`; }
function fmtTime(iso){ try{ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})+' ET'; }catch(e){ return ''; } }

async function sb(path){
  const sep=path.includes('?')?'&':'?';
  const r=await fetch(`${SB_URL}/rest/v1/${path}${sep}apikey=${SB_KEY}`);
  if(!r.ok) throw new Error(`Database error ${r.status}`);
  return r.json();
}
async function sbAll(path, pageSize=1000){
  let out=[], off=0;
  for(;;){
    const rows=await sb(`${path}&limit=${pageSize}&offset=${off}`);
    out=out.concat(rows);
    if(rows.length<pageSize) break;
    off+=pageSize;
  }
  return out;
}

/* ============ STATE ============ */
const S = {
  view:'teams', day:null, games:[], finals:[], players:new Map(), lineups:[],
  team:null, logCache:new Map(), goalieSV:new Map(), updatedAt:null,
  teamStats:null, topRows:null
};


/* ============ FITTED PLAYER MODELS (Assists o0.5, Shots o2.5) ============ */
// From backtest_player_props_v2.py. They use only this season's games and were
// tested on players with 10+ games, so until then the board uses the plain
// season-long hit rate (this season + last).
// Fitted player-prop models from backtest_player_props_v2.py
// (logistic regression, 2025-26 skater-games through 2026-01-31).
const ASSISTS_MODEL = {            // Assists over 0.5
  intercept: -3.277146,
  long: 0.527562,                  // logit of the shrunk season hit rate
  lnToiSeason: -0.161009,          // ln(average minutes, season)
  lnToiLast10: 1.140031            // ln(average minutes, last 10 games)
};
const SHOTS_MODEL = {              // Shots on goal over 2.5
  intercept: -1.248728,
  long: 0.605839,
  lnToiSeason: -0.592917,
  lnToiLast10: 0.976668,
  lnOppGa: 0.037397,               // ln(opponent blended GA / league goals per team-game)
  lnOppAtt: 2.257895,              // ln(opponent shot attempts allowed per game / league average)
  decay: 0.221963                  // logit of the decay-weighted hit rate (0.80 per game)
};
const PROP_SHRINK = 10;            // games of "what his average implies" mixed into the season rate
const DECAY_SHRINK = 5;            // same, for the decay-weighted rate
const DECAY = 0.80;                // each game further back counts 0.80 as much
const ATTEMPT_SHRINK = 10;         // games of league-average attempts mixed into the opponent's rate

function toiMinutes(toi) {         // "18:34" -> 18.5667
  const [m, s] = String(toi).split(':').map(Number);
  return m + s / 60;
}
function logit(p) {
  p = Math.min(Math.max(p, 1e-4), 1 - 1e-4);
  return Math.log(p / (1 - p));
}
function poissonAtLeast(mean, need) {   // P(X >= need), X ~ Poisson(mean)
  let below = 0, term = Math.exp(-mean);
  for (let i = 0; i < need; i++) { below += term; term *= mean / (i + 1); }
  return 1 - below;
}

// stats: the stat in each of the player's earlier games THIS season, oldest first.
// need: 1 for assists over 0.5, 3 for shots over 2.5.
// leagueMean: league average of the stat per skater-game, season to date.
function hitRates(stats, need, leagueMean) {
  const n = stats.length;
  const sum = stats.reduce((a, b) => a + b, 0);
  const hits = stats.filter(v => v >= need).length;
  // What his (shrunk) per-game average implies his hit rate should be.
  const implied = poissonAtLeast((sum + leagueMean * PROP_SHRINK) / (n + PROP_SHRINK), need);
  const longRate = (hits + implied * PROP_SHRINK) / (n + PROP_SHRINK);
  // Decay-weighted: newest game weight 1, the one before 0.80, then 0.64, ...
  let wHits = 0, w = 0;
  for (const v of stats) { wHits = wHits * DECAY + (v >= need ? 1 : 0); w = w * DECAY + 1; }
  const decayRate = (wHits + implied * DECAY_SHRINK) / (w + DECAY_SHRINK);
  return { longRate, decayRate };
}

// toi: "MM:SS" strings for the same earlier games, oldest first (needs 10+).
function toiInputs(toi) {
  const mins = toi.map(toiMinutes);
  const season = mins.reduce((a, b) => a + b, 0) / mins.length;
  const last10 = mins.slice(-10).reduce((a, b) => a + b, 0) / 10;
  return { lnSeason: Math.log(Math.max(1, season)), lnLast10: Math.log(Math.max(1, last10)) };
}

// Chance of 1+ assists. leagueAssists: league assists per skater-game, season to date.
function assistsOverChance(assists, toi, leagueAssists) {
  const m = ASSISTS_MODEL, r = hitRates(assists, 1, leagueAssists), t = toiInputs(toi);
  const z = m.intercept + m.long * logit(r.longRate) + m.lnToiSeason * t.lnSeason + m.lnToiLast10 * t.lnLast10;
  return 1 / (1 + Math.exp(-z));
}

// Chance of 3+ shots on goal. leagueSog: league shots per skater-game, season to date.
// opp = {
//   gaBlend:         opponent blended goals against per game (the board's blended(opp).ga)
//   leagueGoals:     league goals per team per game, season to date, shootout goal removed
//   attemptsAllowed: opponent shot attempts allowed per game, this season (team_attempts_allowed view)
//   games:           how many games that average covers
//   leagueAttempts:  league average shot attempts per team per game, this season
// }
function shotsOverChance(sog, toi, leagueSog, opp) {
  const m = SHOTS_MODEL, r = hitRates(sog, 3, leagueSog), t = toiInputs(toi);
  const oppAtt = (opp.attemptsAllowed * opp.games + opp.leagueAttempts * ATTEMPT_SHRINK) / (opp.games + ATTEMPT_SHRINK);
  const z = m.intercept + m.long * logit(r.longRate) + m.lnToiSeason * t.lnSeason + m.lnToiLast10 * t.lnLast10 +
            m.lnOppGa * Math.log(opp.gaBlend / opp.leagueGoals) +
            m.lnOppAtt * Math.log(oppAtt / opp.leagueAttempts) +
            m.decay * logit(r.decayRate);
  return 1 / (1 + Math.exp(-z));
}

const LEAGUE_ASSISTS=0.3057, LEAGUE_SOG=1.6104;   // full 2025-26 per skater-game, used as the league mean
const MODEL_MIN_GAMES=10;
S.attempts=null;
async function loadAttempts(){
  if(S.attempts) return;
  try{ S.attempts=await sb(`team_attempts_allowed?season=eq.${CUR}&select=team,games,attempts_allowed_per_game`); }catch(e){ S.attempts=[]; }
}
function leagueAttempts(){
  let g=0,a=0; (S.attempts||[]).forEach(r=>{ if(r.attempts_allowed_per_game!=null){ g+=r.games; a+=r.games*r.attempts_allowed_per_game; } });
  return g>=20?a/g:60;
}
// Returns the model's chance (0-1) or null when the model can't be used yet.
function modelChance(pid, stat, line, opp){
  if(!((stat==='Assists'&&line===0.5)||(stat==='Shots'&&line===2.5))) return null;
  const logs=(S.logCache.get(pid)||[]).filter(r=>r.season===CUR&&r.toi).slice().reverse();   // oldest first, this season
  if(logs.length<MODEL_MIN_GAMES) return null;
  const toi=logs.map(r=>r.toi);
  try{
    if(stat==='Assists') return assistsOverChance(logs.map(r=>r.assists||0),toi,LEAGUE_ASSISTS);
    const a=(S.attempts||[]).find(r=>r.team===opp);
    const la=leagueAttempts();
    const rt=rates(opp,S.day);
    const att=a&&a.attempts_allowed_per_game!=null?+a.attempts_allowed_per_game:la, gm=a&&a.attempts_allowed_per_game!=null?a.games:0;
    return shotsOverChance(logs.map(r=>r.sog||0),toi,LEAGUE_SOG,{gaBlend:rt.ga,leagueGoals:leagueAvg(S.day),attemptsAllowed:att,games:gm,leagueAttempts:la});
  }catch(e){ return null; }
}

/* ============ TEAM ENGINE ============ */
// Goals for/against per team from final scores. A shootout win is 1 goal
// inflated for the winner (the SO goal), so it is removed.
function buildTeamStats(){
  const t={};
  const get=(tm)=>t[tm]||(t[tm]={games:[]});
  S.finals.forEach(g=>{
    let a=g.away_score, h=g.home_score;
    if(g.last_period_type==='SO'){ if(a>h) a--; else h--; }
    get(g.away).games.push({date:g.game_date,season:g.season,gf:a,ga:h});
    get(g.home).games.push({date:g.game_date,season:g.season,gf:h,ga:a});
  });
  Object.values(t).forEach(x=>x.games.sort((p,q)=>p.date<q.date?-1:1));
  S.teamStats=t;
}
// League average goals per team per game (shootout-adjusted), only games before `day`.
function leagueAvg(day){
  let cur=0,curN=0,all=0,allN=0;
  Object.values(S.teamStats).forEach(x=>x.games.forEach(g=>{
    if(g.date>=day) return;
    all+=g.gf; allN++;
    if(g.season===CUR){ cur+=g.gf; curN++; }
  }));
  if(curN>=200) return cur/curN;
  return allN?all/allN:LEAGUE_AVG;
}
// Blended rate (last season counts as 15 games) and last-10 rate, using only games before `day`.
function rates(tm, day){
  const s=S.teamStats[tm];
  const gs=s?s.games.filter(g=>g.date<day):[];
  const prev=gs.filter(g=>g.season!==CUR), cur=gs.filter(g=>g.season===CUR);
  const sum=(arr,k)=>arr.reduce((a,g)=>a+g[k],0);
  const pgf=prev.length?sum(prev,'gf')/prev.length:LEAGUE_AVG, pga=prev.length?sum(prev,'ga')/prev.length:LEAGUE_AVG;
  const gf=(pgf*PRIOR_GAMES+sum(cur,'gf'))/(PRIOR_GAMES+cur.length);
  const ga=(pga*PRIOR_GAMES+sum(cur,'ga'))/(PRIOR_GAMES+cur.length);
  const l10=cur.slice(-10), miss=10-l10.length;
  return {gf,ga,gf10:(sum(l10,'gf')+miss*gf)/10, ga10:(sum(l10,'ga')+miss*ga)/10, gp:cur.length};
}
// Fitted team-goals model (Poisson regression on 2025-26 games, from backtest_team_totals.py)
const TEAM_MODEL={intercept:1.097460, gfBlend:0.649684, oppGaBlend:0.158471, gfLast10:-0.104467, oppGaLast10:0.137525, home:0.043517};
function projectGoals(gf,oppGa,gf10,oppGa10,isHome,L){
  const m=TEAM_MODEL, rel=v=>Math.log(Math.max(0.5,v)/L);
  return Math.exp(m.intercept+m.gfBlend*rel(gf)+m.oppGaBlend*rel(oppGa)+m.gfLast10*rel(gf10)+m.oppGaLast10*rel(oppGa10)+(isHome?m.home:0));
}
function chanceAtLeast(mean,k){
  let below=0, term=Math.exp(-mean);
  for(let i=0;i<k;i++){ below+=term; term*=mean/(i+1); }
  return 1-below;
}
function restFactor(tm, day){
  const s=S.teamStats[tm]; if(!s) return {label:'Unknown',days:null};
  const prior=s.games.filter(g=>g.date<day);
  if(!prior.length) return {label:'Season opener',days:null};
  const d=daysBetween(prior[prior.length-1].date, day);
  if(d>30) return {label:'Season opener',days:d};
  if(d<=1) return {label:'Back-to-back',days:d};
  return {label:`${d-1} day${d-1===1?'':'s'} off`,days:d};
}
// Starting goalie for a team on S.day: confirmed starter, else first goalie listed.
function startingGoalie(tm){
  const gs=S.lineups.filter(l=>l.team===tm && l.slot==='goalie' && l.status==='projected').sort((a,b)=>a.list_order-b.list_order);
  if(!gs.length) return null;
  return gs.find(g=>g.confirmed_starter)||gs[0];
}
function projectTeam(tm, opp, isHome){
  const L=leagueAvg(S.day), A=rates(tm,S.day), B=rates(opp,S.day), m=TEAM_MODEL;
  const rel=v=>Math.log(Math.max(0.5,v)/L);
  const proj=projectGoals(A.gf,B.ga,A.gf10,B.ga10,isHome,L);
  const steps=[['Base (league-average team)',m.intercept],['Team scoring (blended)',m.gfBlend*rel(A.gf)],[opp+' goals allowed (blended)',m.oppGaBlend*rel(B.ga)],['Team last 10 goals',m.gfLast10*rel(A.gf10)],[opp+' last 10 goals allowed',m.oppGaLast10*rel(B.ga10)],['Home ice',isHome?m.home:0]];
  let cum=0, prevVal=0; const contrib=steps.map(([lab,v],i)=>{ cum+=v; const val=Math.exp(cum); const d=i===0?val:val-prevVal; prevVal=val; return {lab,d}; });
  const g=startingGoalie(opp);
  const sv=g && g.player_id ? S.goalieSV.get(g.player_id) : null;
  return {tm,opp,proj,contrib,gp:A.gp,goalie:g,sv,rest:restFactor(tm,S.day),green:proj>=GREEN_LIGHT,
          p3:chanceAtLeast(proj,3),p4:chanceAtLeast(proj,4),p5:chanceAtLeast(proj,5)};
}

/* ============ LOGS ============ */
const LOG_COLS='player_id,game_id,season,game_date,team,opponent,home_road,goals,assists,points,sog,shot_attempts,shots_against,goals_against,toi';
async function loadLogs(ids, onlyGoalies=false){
  const need=ids.filter(id=>!S.logCache.has(id));
  const chunks=[]; for(let i=0;i<need.length;i+=12) chunks.push(need.slice(i,i+12));
  let idx=0;
  async function worker(){
    while(idx<chunks.length){
      const c=chunks[idx++];
      const extra=onlyGoalies?'&shots_against=not.is.null':'';
      const rows=await sbAll(`player_game_logs?player_id=in.(${c.join(',')})&game_type=eq.2&select=${LOG_COLS}&order=game_date.desc,game_id.desc${extra}`);
      const by={}; c.forEach(id=>by[id]=[]);
      const seen=new Set(); rows.forEach(r=>{ const k=r.player_id+'_'+r.game_id; if(seen.has(k)) return; seen.add(k); (by[r.player_id]||(by[r.player_id]=[])).push(r); });
      c.forEach(id=>S.logCache.set(id,by[id]));
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
}
async function loadGoalieSV(){
  const ids=[...new Set(S.lineups.filter(l=>l.slot==='goalie'&&l.player_id).map(l=>l.player_id))];
  if(!ids.length) return;
  await loadLogs(ids,true);
  ids.forEach(id=>{
    const rows=(S.logCache.get(id)||[]).filter(r=>r.shots_against!=null);
    let sa=0, ga=0;
    rows.forEach(r=>{ sa+=r.shots_against; ga+=r.goals_against||0; });
    // shrink toward league average so a tiny sample can't swing the number
    const K=400;
    S.goalieSV.set(id, ((sa-ga)+LEAGUE_SV*K)/(sa+K));
  });
}

/* ---- stats from logs ---- */
function statVal(r,stat){
  if(stat==='Saves') return r.shots_against!=null ? r.shots_against-(r.goals_against||0) : null;
  return r[STATS[stat].col];
}
function filterRows(rows, o){
  let r=rows.slice();
  if(o.split==='Home') r=r.filter(x=>x.home_road==='H');
  if(o.split==='Away') r=r.filter(x=>x.home_road==='R');
  if(o.vs) r=r.filter(x=>x.opponent===o.vs);
  if(o.vs) return r;                       // head-to-head ignores the timeframe: every meeting we have
  if(o.window==='Season') r=r.filter(x=>x.season===CUR);
  else if(o.window!=='All-time') r=r.slice(0,parseInt(o.window.split(' ')[1],10));
  return r;
}
function hitStats(rows, stat, line){
  const v=rows.map(r=>statVal(r,stat)).filter(x=>x!=null);
  const n=v.length, over=v.filter(x=>x>line).length;
  return {n, over, under:n-over, pct:n?over/n:0, avg:n?v.reduce((a,b)=>a+b,0)/n:0};
}

  });
  if(!green.length){ $('view').innerHTML='<div class="empty">No team clears the green light today, so no player props qualify.</div>'; return; }
  await loadAttempts();
  if(!S.topRows){
    const skaters=S.lineups.filter(l=>green.some(p=>p.tm===l.team) && l.status==='projected' && (l.slot==='line'||l.slot==='pair') && l.player_id);
    await loadLogs([...new Set(skaters.map(s=>s.player_id))]);
    const rows=[];
    skaters.forEach(s=>{
      const logs=S.logCache.get(s.player_id)||[];
      ['Points','Goals','Assists','Shots'].forEach(stat=>{
        const line=STATS[stat].line;
        const all=hitStats(logs,stat,line), l10=hitStats(logs.slice(0,10),stat,line);
        if(all.n<15) return;
        rows.push({s,stat,line,all,l10,tm:s.team});
      });
    });
    const pool={};
    ['Points','Goals','Assists','Shots'].forEach(st=>{ const r=rows.filter(x=>x.stat===st); const o=r.reduce((a,x)=>a+x.all.over,0), n=r.reduce((a,x)=>a+x.all.n,0); pool[st]=n?o/n:0.3; });
    rows.forEach(r=>{
      r.rate=(r.all.over+SHRINK_K*pool[r.stat])/(r.all.n+SHRINK_K);
      const tp=green.find(x=>x.tm===r.tm), mc=modelChance(r.s.player_id,r.stat,r.line,tp?tp.opp:'');
      if(mc!=null){ r.rate=mc; r.model=true; }
    });
    S.topRows=rows;
  }
  const statSel=S.topStat||'best';
  // ---- priced plays (Points / Assists with real book prices) ----
  const skaterIds=new Set(S.lineups.filter(l=>green.some(p=>p.tm===l.team)&&l.status==='projected'&&(l.slot==='line'||l.slot==='pair')&&l.player_id).map(l=>l.player_id));
  const poolMemo={};
  const poolFor=(stat,line)=>{ const k=stat+'|'+line; if(poolMemo[k]!=null) return poolMemo[k]; let o=0,n=0; skaterIds.forEach(id=>{ const h=hitStats(S.logCache.get(id)||[],stat,line); o+=h.over; n+=h.n; }); return poolMemo[k]=n?o/n:0.3; };
  const groups=new Map();
  (S.odds||[]).forEach(o=>{
    const stat=MARKET_STAT[o.market]; if(!stat||!o.player_id||!skaterIds.has(o.player_id)) return;
    const k=o.player_id+'|'+stat+'|'+o.line; if(!groups.has(k)) groups.set(k,{pid:o.player_id,stat,line:+o.line,prices:[]});
    groups.get(k).prices.push({price:o.price,book:o.book});
  });
  const lineupBy=new Map(); S.lineups.forEach(l=>{ if(l.player_id) lineupBy.set(l.player_id,l); });
  const covered=new Set(); // player|stat combos that have any price today
  let priced=[];
  groups.forEach(gp=>{
    covered.add(gp.pid+'|'+gp.stat);
    const logs=S.logCache.get(gp.pid)||[];
    const all=hitStats(logs,gp.stat,gp.line), l10=hitStats(logs.slice(0,10),gp.stat,gp.line);
    if(all.n<15) return;
    let rate=(all.over+SHRINK_K*poolFor(gp.stat,gp.line))/(all.n+SHRINK_K), model=false;
    { const lt=lineupBy.get(gp.pid), tpp=lt?green.find(x=>x.tm===lt.team):null, mc=modelChance(gp.pid,gp.stat,gp.line,tpp?tpp.opp:''); if(mc!=null){ rate=mc; model=true; } }
    const sorted=gp.prices.slice().sort((x,y)=>x.price-y.price);
    const ps=sorted.map(x=>x.price), bestBook=sorted[sorted.length-1].book;
    const best=ps[ps.length-1], worst=ps[0], mid=ps[Math.floor(ps.length/2)];
    if(best<FLOOR_BY_STAT[gp.stat]) return;
    const edge=(rate-impliedProb(mid))*100;
    if(edge<=0) return;
    const l=lineupBy.get(gp.pid);
    const tp=green.find(x=>x.tm===l.team);
    priced.push({s:l,stat:gp.stat,line:gp.line,all,l10,rate,model,best,worst,mid,edge,n:ps.length,tm:l.team,bestBook,teamProj:tp?tp.proj:null,opp:tp?tp.opp:''});
  });
  priced=priced.filter(r=>statSel==='best'||r.stat===statSel);
  const bestBy=new Map(); priced.forEach(r=>{ const k=r.s.player_id+(statSel==='best'?'':r.stat); if(!bestBy.has(k)||r.edge>bestBy.get(k).edge) bestBy.set(k,r); });
  priced=[...bestBy.values()].sort((a,b)=>b.edge-a.edge).slice(0,30);
  const oddsTime=(S.odds||[]).map(o=>o.updated_at).sort().pop();
  const bookShort=b=>({DraftKings:'DK',FanDuel:'FD',BetMGM:'MGM','BetOnline.ag':'BetOnline',Bovada:'Bovada'}[b]||b);
  const priceTxt=r=>`<b style="color:var(--text)">Best ${fmtOdds(r.best)}</b> ${esc(bookShort(r.bestBook))}`;
  const pricedHTML=priced.map(r=>`<div class="prow" data-pid="${r.s.player_id}" data-stat="${r.stat}" data-line="${r.line}" data-odds="${r.mid}">
      <div><div class="pname">${esc(r.s.player_name)}</div><div class="pmeta">${esc(r.tm)} · ${r.stat} o${r.line} · ${priceTxt(r)}</div><div class="pmeta">${r.model?'Model chance':'Hit rate'} ${Math.round(r.rate*100)}% (${r.all.over}/${r.all.n}) · fair ${fmtOdds(fairOdds(r.rate))}${r.best===r.worst?'':` · worst book ${fmtOdds(r.worst)}`}</div><div class="pmeta">Team projection ${r.teamProj!=null?r.teamProj.toFixed(2)+' goals vs '+esc(r.opp):'—'}</div></div>
      <div><div class="pbig" style="color:var(--green)">+${r.edge.toFixed(1)}</div><div class="psub">EDGE</div></div></div>`).join('');
  const priceNote=(S.odds&&S.odds.length)?`Prices as of ${new Date(oddsTime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})} ET. Shows the best book price; edge uses the middle price across books. Points and assists worse than -140 (goals, -160) are hidden.`:'Prices for Points and Assists load once a day around 4 PM ET. None are in yet.';

  // ---- hit-rate list (everything else, or no price yet) ----
  const plusMoney=(statSel==='Goals'||statSel==='Shots');
  let rows=S.topRows.filter(r=>(plusMoney||r.rate>=MIN_PLAY_HIT) && (statSel==='best'?r.stat!=='Goals':r.stat===statSel) && !covered.has(r.s.player_id+'|'+r.stat));
  if(statSel==='best'){          // one best prop per player
    const best=new Map();
    rows.forEach(r=>{ const k=r.s.player_id; if(!best.has(k)||r.rate>best.get(k).rate) best.set(k,r); });
    rows=[...best.values()];
  }
  rows.sort((a,b)=>b.rate-a.rate);
  rows=rows.slice(0,plusMoney?25:40);
  const filter=`<div class="row" style="grid-template-columns:1fr;"><div><label>Stat</label><select id="topStat">${['best','plus','Points','Goals','Assists','Shots'].map(x=>`<option value="${x}" ${x===statSel?'selected':''}>${x==='best'?'Best prop (auto)':(x==='plus'?'Plus-money finder (all teams)':x)}</option>`).join('')}</select></div></div>`;
  const note=`<div class="muted small" style="margin-bottom:10px;">Only players on green-lit teams (${green.map(g=>g.tm).join(', ')}). Ranked by season-long hit rate (this season plus last, the one measure that predicted in testing).</div>`;
  const list=rows.length?rows.map(r=>{
    const fo=fairOdds(r.rate);
    return `<div class="prow" data-pid="${r.s.player_id}" data-stat="${r.stat}">
      <div><div class="pname">${esc(r.s.player_name)}</div><div class="pmeta">${esc(r.tm)} · ${r.stat} o${r.line} · L10 ${r.l10.over}/${r.l10.n}${r.model?' · MODEL':''}</div></div>
      <div><div class="pbig" style="color:var(--green)">${Math.round(r.rate*100)}%</div><div class="psub">${r.all.over}/${r.all.n} · fair ${fmtOdds(fo)}</div></div></div>`;
  }).join(''):'<div class="empty">Nothing else clears the bar today.</div>';
  const hdr=(t,sub)=>`<div class="section-label" style="margin:14px 0 6px;">${t}</div>${sub?`<div class="muted small" style="margin-bottom:8px;">${sub}</div>`:''}`;
  $('view').innerHTML=filter+note+
    (priced.length?hdr('PRICED PLAYS',priceNote)+pricedHTML:((S.odds&&S.odds.length)?hdr('PRICED PLAYS',priceNote)+'<div class="empty">No priced play beats its break-even today.</div>':hdr('PRICED PLAYS',priceNote)))+
    hdr('HIT RATE ONLY',plusMoney?`${statSel} pay plus money, so there's no minimum hit rate here. Ranked by season-long hit rate. Take it only if your book pays better than the fair price.`:`${Math.round(MIN_PLAY_HIT*100)}%+ (break-even of −140). Fair price is what the rate is worth — compare it to your book.`)+list;
  $('topStat').onchange=e=>{ S.topStat=e.target.value; renderTop(); };
}


/* ---- Plus-money finder: every team, no green-light gate, prices +100 or better ---- */
async function renderPlus(){
  const sel=`<div class="row" style="grid-template-columns:1fr;"><div><label>Stat</label><select id="topStat">${['best','plus','Points','Goals','Assists','Shots'].map(x=>`<option value="${x}" ${x==='plus'?'selected':''}>${x==='best'?'Best prop (auto)':(x==='plus'?'Plus-money finder (all teams)':x)}</option>`).join('')}</select></div></div>`;
  const wire=()=>{ $('topStat').onchange=e=>{ S.topStat=e.target.value; renderTop(); }; };
  if(!S.odds||!S.odds.length){
    $('view').innerHTML=sel+'<div class="empty">No prices yet. They load once a day around 4 PM ET, and this view needs them.</div>'; wire(); return;
  }
  $('view').innerHTML=sel+'<div class="empty">Checking every priced player against his real game log…</div>'; wire();
  await loadAttempts();
  const ids=[...new Set(S.odds.filter(o=>MARKET_STAT[o.market]&&o.player_id).map(o=>o.player_id))];
  await loadLogs(ids);
  const groups=new Map();
  S.odds.forEach(o=>{
    const stat=MARKET_STAT[o.market]; if(!stat||!o.player_id) return;
    const k=o.player_id+'|'+stat+'|'+o.line; if(!groups.has(k)) groups.set(k,{pid:o.player_id,stat,line:+o.line,prices:[]});
    groups.get(k).prices.push({price:o.price,book:o.book});
  });
  const poolMemo={};
  const poolFor=(stat,line)=>{ const k=stat+'|'+line; if(poolMemo[k]!=null) return poolMemo[k]; let o=0,n=0; ids.forEach(id=>{ const h=hitStats(S.logCache.get(id)||[],stat,line); o+=h.over; n+=h.n; }); return poolMemo[k]=n?o/n:0.3; };
  const bookShort=b=>({DraftKings:'DK',FanDuel:'FD',BetMGM:'MGM','BetOnline.ag':'BetOnline',Bovada:'Bovada'}[b]||b);
  const out=[];
  groups.forEach(gp=>{
    const logs=S.logCache.get(gp.pid)||[];
    const all=hitStats(logs,gp.stat,gp.line);
    if(all.n<40) return;                              // need a real sample for a "consistent" read
    const sorted=gp.prices.slice().sort((x,y)=>x.price-y.price);
    const best=sorted[sorted.length-1].price, bestBook=sorted[sorted.length-1].book, mid=sorted[Math.floor(sorted.length/2)].price;
    if(best<100) return;                              // plus money only
    let rate=(all.over+SHRINK_K*poolFor(gp.stat,gp.line))/(all.n+SHRINK_K), model=false;
    const mc=modelChance(gp.pid,gp.stat,gp.line,''); if(mc!=null){ rate=mc; model=true; }
    const edge=(rate-impliedProb(mid))*100;
    if(edge<=0) return;
    const cur=hitStats(logs.filter(r=>r.season===CUR),gp.stat,gp.line), prev=hitStats(logs.filter(r=>r.season!==CUR),gp.stat,gp.line);
    const pl=S.players.get(gp.pid)||{name:'Player',team:''};
    out.push({pid:gp.pid,name:pl.name,team:pl.team,stat:gp.stat,line:gp.line,all,rate,model,best,bestBook,mid,edge,cur,prev});
  });
  out.sort((a,b)=>b.edge-a.edge);
  const top=out.slice(0,40);
  const pctTxt=h=>h.n?Math.round(h.pct*100)+'% ('+h.over+'/'+h.n+')':'—';
  const list=top.length?top.map(r=>`<div class="prow" data-pid="${r.pid}" data-stat="${r.stat}" data-line="${r.line}" data-odds="${r.mid}">
      <div><div class="pname">${esc(r.name)}</div><div class="pmeta">${esc(r.team)} · ${r.stat} o${r.line} · <b style="color:var(--text)">Best ${fmtOdds(r.best)}</b> ${esc(bookShort(r.bestBook))}</div>
      <div class="pmeta">${r.model?'Model chance':'Hit rate'} ${Math.round(r.rate*100)}% · fair ${fmtOdds(fairOdds(r.rate))}</div>
      <div class="pmeta">Last season ${pctTxt(r.prev)} · this season ${pctTxt(r.cur)}</div></div>
      <div><div class="pbig" style="color:var(--green)">+${r.edge.toFixed(1)}</div><div class="psub">EDGE</div></div></div>`).join(''):'<div class="empty">No plus-money play beats its break-even right now.</div>';
  const t=S.odds.map(o=>o.updated_at).sort().pop();
  const note=`<div class="muted small" style="margin-bottom:10px;">Every team, no green-light gate. Plus-money prices only (+100 or better), players with 40+ regular-season games. Prices as of ${new Date(t).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})} ET. A steady rate across both seasons is a better sign than one hot year.</div>`;
  $('view').innerHTML=sel+note+list; wire();
}


/* ============ LEADERS: sort players by category, no clicking team by team ============ */
const LEAD_LINES={Points:[0.5,1.5],Goals:[0.5],Assists:[0.5,1.5],Shots:[1.5,2.5,3.5],'Shot Attempts':[3.5,4.5,5.5,6.5]};
S.lead=S.lead||{stat:'Assists',window:'Last 10',team:'ALL',sort:'rate',line:0.5};
async function renderLeaders(){
  const L=S.lead;
  if(!LEAD_LINES[L.stat].includes(L.line)) L.line=STATS[L.stat].line;
  const gs=dayGames();
  const sk=S.lineups.filter(l=>l.status==='projected'&&(l.slot==='line'||l.slot==='pair')&&l.player_id);
  if(!gs.length||!sk.length){ $('view').innerHTML='<div class="empty">Leaders fills in once the day\'s lineups are posted (first update is 12 PM ET).</div>'; return; }
  const teams=[...new Set(sk.map(x=>x.team))].sort();
  if(L.team!=='ALL'&&!teams.includes(L.team)) L.team='ALL';
  const opt=(arr,cur,fmt)=>arr.map(x=>`<option value="${x}" ${String(x)===String(cur)?'selected':''}>${fmt?fmt(x):x}</option>`).join('');
  const controls=`<div class="lgrid">
    <div><label>Category</label><select id="ldStat">${opt(Object.keys(LEAD_LINES),L.stat)}</select></div>
    <div><label>Line (over)</label><select id="ldLine">${opt(LEAD_LINES[L.stat],L.line)}</select></div>
    <div><label>Timeframe</label><select id="ldWin">${opt(['Last 5','Last 10','Last 20','Season','All-time'],L.window)}</select></div>
    <div><label>Team</label><select id="ldTeam"><option value="ALL">All teams today</option>${opt(teams,L.team)}</select></div>
    <div style="grid-column:1/3;"><label>Sort by</label><select id="ldSort">${opt(['rate','avg','last5'],L.sort,x=>({rate:'Hit rate',avg:'Average per game',last5:'Last 5 games'}[x]))}</select></div></div>`;
  const wire=()=>{
    $('ldStat').onchange=e=>{ L.stat=e.target.value; L.line=STATS[L.stat].line; renderLeaders(); };
    $('ldLine').onchange=e=>{ L.line=+e.target.value; renderLeaders(); };
    $('ldWin').onchange=e=>{ L.window=e.target.value; renderLeaders(); };
    $('ldTeam').onchange=e=>{ L.team=e.target.value; renderLeaders(); };
    $('ldSort').onchange=e=>{ L.sort=e.target.value; renderLeaders(); };
  };
  const need=[...new Set(sk.map(x=>x.player_id))].filter(id=>!S.logCache.has(id));
  if(need.length){ $('view').innerHTML=controls+`<div class="empty">Loading real game logs for ${need.length} players (first time only)…</div>`; wire(); await loadLogs(need); if(S.view!=='leaders') return; }
  // best price lookup for the chosen stat/line
  const mk={Points:'player_points',Assists:'player_assists',Goals:'player_goal_scorer_anytime'}[L.stat];
  const best=new Map();
  if(mk) (S.odds||[]).forEach(o=>{ if(o.market===mk&&+o.line===L.line&&o.player_id){ const b=best.get(o.player_id); if(!b||o.price>b.price) best.set(o.player_id,{price:o.price,book:o.book}); } });
  const bookShort=b=>({DraftKings:'DK',FanDuel:'FD',BetMGM:'MGM','BetOnline.ag':'BetOnline',Bovada:'Bovada'}[b]||b);
  const oppOf=tm=>{ const g=gs.find(x=>x.away===tm||x.home===tm); return g?(g.away===tm?'@ '+g.home:'vs '+g.away):''; };
  let rows=sk.filter(x=>L.team==='ALL'||x.team===L.team).map(x=>{
    const logs=S.logCache.get(x.player_id)||[];
    const win=filterRows(logs,{window:L.window,split:'Home+Away',vs:''});
    const h=hitStats(win,L.stat,L.line);
    const l5r=logs.filter(r=>r.season===CUR).slice(0,5).reverse().map(r=>({v:statVal(r,L.stat),d:r.game_date,old:r.season!==CUR})).filter(o=>o.v!=null); const l5=l5r.map(o=>o.v);
    return {x,h,l5,l5r,l5hits:l5.filter(v=>v>L.line).length,pr:best.get(x.player_id)};
  }).filter(r=>r.h.n>=3);
  const key={rate:r=>r.h.pct*1000+r.h.n/1000,avg:r=>r.h.avg,last5:r=>r.l5hits*1000+r.h.pct};
  rows.sort((a,b)=>key[L.sort](b)-key[L.sort](a));
  const total=rows.length; if(L.team==='ALL') rows=rows.slice(0,50);
  const list=rows.length?rows.map(r=>`<div class="prow" data-pid="${r.x.player_id}" data-stat="${L.stat}" data-line="${L.line}"${r.pr?` data-odds="${r.pr.price}"`:''}>
      <div><div class="pname">${esc(r.x.player_name)}</div>
        <div class="pmeta">${esc(r.x.team)} ${esc(oppOf(r.x.team))} · avg ${r.h.avg.toFixed(2)}${r.pr?` · <b style="color:var(--text)">${fmtOdds(r.pr.price)}</b> ${esc(bookShort(r.pr.book))}`:''}</div>
        <div class="dots" title="This season, oldest to newest">${r.l5r.map((o,i)=>{ const dt=o.d.slice(5).replace('-','/').replace(/^0/,'').replace(/\/0/,'/'); return (i>0&&o.old&&!r.l5r[i-1].old?'<div class="sep"></div>':'')+`<div class="g ${o.v>L.line?'h':'m'}${o.old?' old':''}"><b>${o.v}</b><span>${dt}</span></div>`; }).join('')}${r.l5r.some(o=>o.old)?'<div class="yr">dim = last season</div>':''}</div></div>
      <div><div class="pbig" style="color:${r.h.pct>=0.5?'var(--green)':'var(--text)'}">${Math.round(r.h.pct*100)}%</div><div class="psub">${r.h.over}/${r.h.n} · o${L.line} ${esc(L.stat)}</div></div></div>`).join(''):'<div class="empty">No players match.</div>';
  const note=`<div class="muted small" style="margin-bottom:10px;">Everyone in today's projected lineups. Regular season only. Boxes are this season's last 5 regular-season games (no preseason), oldest on the left, newest on the right, with the stat and date. Green = went over. Tap a player for the full game log.${L.team==='ALL'&&total>50?` Showing the top 50 of ${total}.`:''}</div>`;
  $('view').innerHTML=controls+note+list; wire();
}

/* ============ PLAYER MODAL ============ */
const M={};
async function openPlayer(pid, stat, line, odds){
  const p=S.players.get(pid)||{id:pid,name:'Player',team:'',pos:''};
  M.p=p; M.isG=p.pos==='G';
  M.stat=stat||(M.isG?'Saves':'Points'); M.window=stat?'All-time':'Last 10'; M.split='Home+Away'; M.vs='';
  M.line=line!=null?line:(M.isG?24.5:STATS[M.stat].line); M.odds=odds!=null?String(odds):'';
  $('overlay').classList.add('open');
  $('pcard').innerHTML='<div class="empty">Loading game logs…</div>';
  try{
    if(!S.logCache.has(pid)) await loadLogs([pid]);
    M.logs=S.logCache.get(pid)||[];
    // suggest today's opponent for head-to-head
    const g=dayGames().find(x=>x.away===p.team||x.home===p.team);
    M.todayOpp=g?(g.away===p.team?g.home:g.away):'';
    drawPlayer();
  }catch(e){ $('pcard').innerHTML=`<div class="err">${esc(e.message)}</div><button class="close" onclick="closePlayer()">×</button>`; }
}
function closePlayer(){ $('overlay').classList.remove('open'); }
function drawPlayer(){
  const stats=M.isG?['Saves']:Object.keys(STATS);
  const rows=filterRows(M.logs,M);
  const h=hitStats(rows,M.stat,M.line);
  const opps=[...new Set(M.logs.map(r=>r.opponent))].sort();
  const vals=rows.map(r=>statVal(r,M.stat)).filter(x=>x!=null);
  // bars (oldest -> newest)
  const bars=vals.slice().reverse();
  const mx=Math.max(M.line*2,...bars,1);
  const bw=Math.min(26,Math.floor(440/Math.max(bars.length,1)));
  const W=Math.max(bars.length*(bw+4),40), H=110;
  const ly=H-(M.line/mx)*(H-14);
  const svg=bars.length?`<svg viewBox="0 0 ${W} ${H+16}" style="width:100%;height:${H+16}px;" preserveAspectRatio="xMinYMin meet">
    ${bars.map((v,i)=>{const bh=Math.max(2,(v/mx)*(H-14)); return `<rect x="${i*(bw+4)}" y="${H-bh}" width="${bw}" height="${bh}" rx="2" fill="${v>M.line?'#2FBF71':'#E5484D'}"/><text x="${i*(bw+4)+bw/2}" y="${H-bh-3}" text-anchor="middle" font-size="9" fill="#E8ECF1">${v}</text>`;}).join('')}
    <line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="#D4A017" stroke-dasharray="4 3"/></svg>`:'';
  const gamesById=new Map(S.games.map(g=>[g.id,g]));
  const glRows=rows.slice(0,25).map(r=>{
    const g=gamesById.get(r.game_id); let res='';
    if(g&&g.away_score!=null){ const mine=r.team===g.home?g.home_score:g.away_score, th=r.team===g.home?g.away_score:g.home_score; res=(mine>th?'W ':'L ')+mine+'-'+th; }
    const v=statVal(r,M.stat);
    return `<tr><td>${fmtDate(r.game_date)}</td><td>${r.home_road==='H'?'vs':'@'} ${esc(r.opponent)}</td><td>${res}</td><td style="text-align:right;font-weight:700;color:${v==null?'var(--muted)':(v>M.line?'var(--green)':'var(--red)')}">${v==null?'—':v}</td></tr>`;
  }).join('');
  const odds=parseFloat(M.odds);
  let edge='';
  if(!isNaN(odds)){
    const e=(h.pct-impliedProb(odds))*100;
    edge=`<div style="text-align:right"><div class="pbig" style="color:${e>=0?'var(--green)':'var(--red)'}">${e>=0?'+':''}${e.toFixed(1)}</div><div class="psub">${odds<-160?'Worse than −160 — pass':'edge vs break-even '+(impliedProb(odds)*100).toFixed(1)+'%'}</div></div>`;
  }
  const missing=M.stat==='Shot Attempts' && rows.some(r=>r.shot_attempts==null);
  $('pcard').innerHTML=`
    <div class="phead"><div><div class="pnm">${esc(M.p.name)}</div><div class="muted small">${esc(M.p.team)} · ${esc(M.p.pos)} · #${esc(M.p.number??'--')}</div></div><button class="close" id="mClose">&times;</button></div>
    <div class="row3">
      <div><label>Bet type</label><select id="mStat">${stats.map(s=>`<option ${s===M.stat?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Timeframe</label><select id="mWin" ${M.vs?'disabled':''}>${['Last 5','Last 10','Last 20','Last 30','Season','All-time'].map(s=>`<option ${s===M.window?'selected':''}>${s}</option>`).join('')}</select></div>
      <div><label>Splits</label><select id="mSplit">${['Home+Away','Home','Away'].map(s=>`<option ${s===M.split?'selected':''}>${s}</option>`).join('')}</select></div>
    </div>
    <div style="margin-bottom:10px;"><label>Head to head ${M.todayOpp?`(today: ${esc(M.todayOpp)})`:''}</label>
      <select id="mVs"><option value="">None</option>${opps.map(o=>`<option ${o===M.vs?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="hit">
      <div><div class="hpct" style="color:var(--green)">${h.n?Math.round(h.pct*100)+'%':'--'}</div><div class="hlab">Over ${h.over}/${h.n}</div></div>
      <div><div class="hpct" style="color:var(--blue)">${h.n?Math.round((1-h.pct)*100)+'%':'--'}</div><div class="hlab">Under ${h.under}/${h.n}</div></div>
      <div><div class="hpct">${h.n?h.avg.toFixed(2):'--'}</div><div class="hlab">Avg / game</div></div>
    </div>
    ${h.n?svg:'<div class="empty">No games match this filter.</div>'}
    <div class="lineRow"><label style="margin:0;">Line</label><div style="display:flex;align-items:center;gap:8px;"><button class="step" id="mMinus">−</button><div class="lineVal">${M.line}</div><button class="step" id="mPlus">+</button></div></div>
    <div class="edgebox"><div><label style="margin:0 0 4px;">Your book's odds</label><input id="mOdds" type="number" inputmode="numeric" placeholder="-134" value="${esc(M.odds)}"></div>${edge}</div>
    ${missing?'<div class="muted small" style="margin-top:8px;">Some older games have no shot-attempt data yet — they\'re skipped.</div>':''}
    <div style="font-weight:700;font-size:14px;margin:16px 0 2px;">Gamelog</div>
    <div class="muted small" style="margin-bottom:6px;">${M.vs?`Every ${esc(M.vs)} meeting we have on file (regular season, ${h.n} games)`:'Regular season only'}</div>
    <div style="overflow-x:auto;"><table class="gl"><thead><tr><th>Date</th><th>Vs</th><th>Result</th><th style="text-align:right">${esc(M.stat)}</th></tr></thead><tbody>${glRows}</tbody></table></div>`;
  $('mClose').onclick=closePlayer;
  $('mStat').onchange=e=>{ M.stat=e.target.value; if(!M.isG) M.line=STATS[M.stat].line; drawPlayer(); };
  $('mWin').onchange=e=>{ M.window=e.target.value; drawPlayer(); };
  $('mSplit').onchange=e=>{ M.split=e.target.value; drawPlayer(); };
  $('mVs').onchange=e=>{ M.vs=e.target.value; drawPlayer(); };
  $('mMinus').onclick=()=>{ M.line=Math.max(0.5,M.line-1); drawPlayer(); };
  $('mPlus').onclick=()=>{ M.line=M.line+1; drawPlayer(); };
  $('mOdds').oninput=e=>{ M.odds=e.target.value; const pos=e.target.selectionStart; drawPlayer(); const n=$('mOdds'); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} };
}

/* ============ WIRING ============ */
document.addEventListener('click',e=>{
  const gc=e.target.closest('.game-card'); if(gc){ gc.classList.toggle('open'); return; }
  const j=e.target.closest('.jersey-card'); if(j&&j.dataset.pid){ openPlayer(+j.dataset.pid); return; }
  const pr=e.target.closest('.prow'); if(pr){ openPlayer(+pr.dataset.pid, pr.dataset.stat, pr.dataset.line!=null?+pr.dataset.line:null, pr.dataset.odds); return; }
});
$('overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closePlayer(); });
$('bTeams').onclick=()=>setView('teams');
$('bLineups').onclick=()=>setView('lineups');
$('bTop').onclick=()=>setView('top');
$('bLeaders').onclick=()=>setView('leaders');
$('teamPick').onchange=e=>{ S.team=e.target.value; renderLineups(); };
setInterval(()=>{ if(S.autoDay && etToday()!==S.autoDay) init(false); },300000);
$('reload').onclick=()=>init(true);

async function init(keepDay){
  $('view').innerHTML='<div class="empty">Loading real NHL data…</div>';
  try{
    S.logCache.clear(); S.goalieSV.clear();
    await loadCore();
    if(!keepDay||!S.day){
      let d=etToday();
      if(!S.games.some(g=>g.game_date===d)){
        const later=S.games.filter(g=>g.game_date>=d).map(g=>g.game_date).sort()[0];
        const earlier=S.games.filter(g=>g.game_date<d).map(g=>g.game_date).sort().pop();
        d=later||earlier||d;
      }
      S.day=d;
    }
    S.autoDay=etToday();
    $('dayLabel').textContent=new Date(S.day+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    await loadDay();
    setUpdated();
    render();
  }catch(e){
    $('updated').textContent='Offline';
    $('view').innerHTML=`<div class="err">Couldn't reach the database (${esc(e.message)}). Check your connection and tap Refresh.</div>`;
  }
}
init();
</script>
