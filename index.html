<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ice Engine 🧊⚙️</title>
<meta name="description" content="NHL team goal projections, player props and prices, updated daily from real game data.">

<meta property="og:site_name" content="Ice Engine 🧊⚙️">
<meta property="og:title" content="Ice Engine — NHL team totals and player props">
<meta property="og:description" content="Projected goals for every game, the best prop plays, and real book prices. Updated daily from real game data.">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Ice Engine — NHL team totals and player props">
<meta name="twitter:description" content="Projected goals for every game, the best prop plays, and real book prices. Updated daily from real game data.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14; --card:#121821; --card2:#171F2B; --line:#232C3A;
  --text:#E8ECF1; --muted:#7A8699; --amber:#D4A017;
  --green:#2FBF71; --red:#E5484D; --blue:#5B9CF6;
}
*{box-sizing:border-box;}
html{background:#0A0E14; color-scheme:dark;}
body{margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; line-height:1.4; -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:640px; margin:0 auto; padding:22px 16px 60px;}
h1{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:32px; margin:0; white-space:nowrap; flex-shrink:0;}
@media(max-width:480px){h1{font-size:23px; flex-shrink:1; white-space:normal;} .updated{font-size:10.5px; min-width:0;}}
.top{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;}
.updated{color:var(--muted); font-size:11.5px; text-align:right;}
.reload{background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:3px 8px; font-size:11.5px; cursor:pointer; margin-top:3px;}
label{display:block; font-size:12px; color:var(--muted); margin:0 0 5px; font-weight:500;}
input,select{width:100%; background:var(--card2); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:7px; font-size:15px; font-family:'Inter',sans-serif;}
input:focus,select:focus{outline:none; border-color:var(--amber);}
.row>div,.row3>div{min-width:0;}
input[type=date]{min-width:0; -webkit-appearance:none; appearance:none; min-height:42px; text-align:left;}
.row{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px;}
.view-toggle{display:flex; gap:6px; margin:12px 0;}
.view-toggle button{white-space:nowrap; padding-left:2px !important; padding-right:2px !important; font-size:13px !important; flex:1; background:var(--card2); border:1px solid var(--line); color:var(--muted); padding:9px; border-radius:7px; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; cursor:pointer;}
.view-toggle button.active{background:var(--amber); color:#0A0E14; border-color:var(--amber);}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px;}
.muted{color:var(--muted);} .small{font-size:12px;}
.empty{color:var(--muted); font-size:13.5px; text-align:center; padding:28px 10px;}
.err{color:var(--red); font-size:13px; padding:14px; border:1px solid var(--red); border-radius:8px; margin:10px 0;}
/* Teams */
.game-card{cursor:pointer;}
.game-head{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-bottom:8px;}
.matchup{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;}
.side{text-align:center;}
.side{display:flex; align-items:center; justify-content:center; gap:6px;}
.side.homeSide{flex-direction:row-reverse;}
.stext{text-align:center;}
.chrow{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; font-size:11px; color:var(--muted); text-align:center;}
.chrow b{color:var(--text);}
.matchup2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.tcol{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 10px; text-align:center;}
.tcol.green{border-color:rgba(47,191,113,.55); box-shadow:0 0 0 1px rgba(47,191,113,.15) inset;}
.thead{display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:6px;}
.thead .tjersey{width:52px;}
.thead .tabbr{text-align:left; line-height:1;}
.thead .tlabel{text-align:left; margin-top:3px;}
.tcol .tproj{font-size:44px; margin:2px 0 0;}
.tlabel{font-size:9.5px; letter-spacing:.6px; color:var(--muted); font-weight:600;}
.tcol .chip{margin:8px 0 10px;}
.odds3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; border-top:1px solid var(--line); padding-top:10px;}
.o3v{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:17px;}
.o3bar{height:4px; background:var(--line); border-radius:2px; margin:3px 0 4px; overflow:hidden;}
.o3bar i{display:block; height:100%; background:var(--amber); border-radius:2px;}
.o3k{font-size:9.5px; color:var(--muted);}
.ou3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px;}
.ou{background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:7px 4px; text-align:center;}
.ouL{font-size:9.5px; letter-spacing:.5px; color:var(--muted); font-weight:600;}
.ouV{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14px; margin-top:2px; white-space:nowrap;}
.gtotal{text-align:center; font-size:11.5px; color:var(--muted); margin-top:10px;}
.gtotal b{color:var(--text);}
.dots{display:flex; gap:3px; margin-top:6px; align-items:flex-start;}
.dots .g{display:flex; flex-direction:column; align-items:center; gap:2px;}
.lrow{flex-wrap:wrap;} .lrow .dots{flex-basis:100%; order:3;}
.dots .g{flex:1; max-width:30px; min-width:0;}
.dots .g b{width:100%; height:22px; border-radius:4px; background:var(--line); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff;}
.dots .g.h b{background:var(--green); color:#04210f;} .dots .g.m b{background:var(--red); opacity:.8;}
.dots .g span{font-size:9px; color:var(--muted,#8a93a6); line-height:1;}
.dots .g.old b{opacity:.45;}
.dots.tight .g span{display:none;} .dots.tight{gap:2px;} .dots.tight .g b{height:20px; font-size:10px; border-radius:3px;}
.dots .sep{width:1px; align-self:stretch; background:var(--muted,#8a93a6); opacity:.5; margin:0 3px;}
.dots .yr{font-size:9px; color:var(--muted,#8a93a6); align-self:center; margin-left:2px;}
.chips{display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 4px; margin:10px 0 0; -webkit-overflow-scrolling:touch;}
.mc{flex:none; font:inherit; font-size:12px; font-weight:700; padding:7px 9px; border-radius:999px; border:1px solid var(--line); background:var(--card2); color:var(--muted); cursor:pointer;}
.mc.on{background:var(--green); color:#04210f; border-color:var(--green);} .mc:disabled{opacity:.4;}
.ou{background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:4px 12px; margin:12px 0;}
.ourow{display:flex; align-items:center; gap:10px; padding:9px 0;} .ourow+.ourow{border-top:1px solid var(--line);}
.oul{font-size:15px; font-weight:700; width:52px;} .oup{font-size:17px; font-weight:800;}
.oun{font-size:12px; font-weight:700; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:3px 8px;}
.oupr{margin-left:auto; font-size:14px; font-weight:800; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px;}
.chead{display:flex; align-items:center; justify-content:space-between; margin:-2px 0 10px; font-size:12px; font-weight:700; color:#D4A017;}
.stp{display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:2px;}
.stp .step{width:30px; height:28px; border-radius:999px; border:0; background:transparent; color:var(--text); font-size:18px; line-height:1; cursor:pointer;}
.stp b{min-width:34px; text-align:center; font-size:14px; color:var(--text);}
.chart2{margin:6px 0 4px; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:12px 10px 8px;}
.plot{position:relative; display:flex; align-items:flex-end; gap:3px; padding-left:24px; border-bottom:1px solid var(--line);}
.grid{position:absolute; left:0; right:0; border-top:1px solid rgba(255,255,255,.07); pointer-events:none;}
.grid span{position:absolute; left:0; top:-7px; font-size:10px; color:var(--muted);}
.cb{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;}
.cb i{display:block; width:100%; max-width:34px; border-radius:5px 5px 0 0;}
.cb em{font-style:normal; font-size:11px; font-weight:700; margin-bottom:2px; color:var(--text);}
.lineMark{position:absolute; left:24px; right:0; border-top:2px dashed #D4A017; pointer-events:none; z-index:2;}
.lineMark span{position:absolute; right:0; top:-17px; font-size:10px; font-weight:700; color:#D4A017; background:var(--card2); padding:0 4px; border-radius:4px;}
.ysep{width:0; align-self:stretch; border-left:1px dashed var(--muted); opacity:.5; margin:0 2px;}
.clab{display:flex; gap:3px; margin-top:5px; padding-left:24px;} .clab div{flex:1; min-width:0; text-align:center; display:flex; flex-direction:column; line-height:1.15;}
.clab b{font-size:9.5px;} .clab span{font-size:8.5px; color:var(--muted); overflow:hidden;}
.cax{padding-left:24px; display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:5px;}
.cleg{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:10.5px; color:var(--muted); margin-top:8px;}
.cleg i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px;} .cleg u{display:inline-block; width:12px; border-top:2px dashed #D4A017; margin-right:4px; vertical-align:middle;}
.jersey-card{position:relative;}
.ppbadge{position:absolute; top:4px; right:4px; font-size:10px; font-weight:800; padding:2px 5px; border-radius:5px; background:#D4A017; color:#1a1300; letter-spacing:.3px;}
.flab{font-size:11px; color:var(--muted); margin:10px 0 0; font-weight:700; letter-spacing:.3px; text-transform:uppercase;}
.mini{font:inherit; font-size:12px; padding:6px 8px; border-radius:999px; background:var(--card2); color:var(--muted); border:1px solid var(--line);}
.more{margin-top:10px;} .more summary{font-size:12px; color:var(--muted); cursor:pointer; padding:4px 0;}
.lgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
.tjersey{width:66px; flex:none; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
.tabbr{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px;}
.tproj{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:30px; line-height:1;}
.at{color:var(--muted); font-size:13px;}
.chip{white-space:nowrap; display:inline-block; font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:5px; margin-top:5px; letter-spacing:.3px;}
.chip.go{background:rgba(47,191,113,.15); color:var(--green);}
.chip.no{background:rgba(122,134,153,.15); color:var(--muted);}
.detail{display:none; margin-top:10px; border-top:1px solid var(--line); padding-top:10px; font-size:12px;}
.game-card.open .detail{display:block;}
.detail table{width:100%; border-collapse:collapse;}
.detail td{padding:3px 0;} .detail td:last-child{text-align:right;}
/* Jerseys */
.dayfold{margin:14px 0 10px;} .dayfold>summary{list-style:none; cursor:pointer; position:relative; background:var(--card2); border:1px solid var(--line); border-radius:7px; padding:8px 28px; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; letter-spacing:.5px;}
.dayfold>summary::-webkit-details-marker{display:none;} .dayfold>summary::after{content:'▾'; position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); transition:transform .15s;}
.dayfold:not([open])>summary::after{transform:translateY(-50%) rotate(-90deg);} .dayfold[open]>summary{margin-bottom:10px;}
.section-label{background:var(--card2); border:1px solid var(--line); border-radius:7px; padding:8px 0; text-align:center; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:14px; letter-spacing:.5px; margin:14px 0 10px;}
.jersey-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.jersey-card{text-align:center; cursor:pointer; background:none; border:none; padding:0; color:var(--text); font-family:'Inter',sans-serif;}
.jersey-svg{width:68%; margin:0 auto; display:block; filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));}
.jname{font-size:10.5px; margin-top:4px; color:var(--muted); line-height:1.2;}
.jstat{font-size:10px; margin-top:2px; font-weight:700;}
.dim{opacity:.45;}
/* Top plays */
.prow{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
.pname{font-weight:600; font-size:15px;}
.pmeta{color:var(--muted); font-size:12px; margin-top:2px;}
.pbig{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px; text-align:right;}
.psub{color:var(--muted); font-size:11px; text-align:right;}
/* Modal */
.overlay{position:fixed; inset:0; background:rgba(5,7,10,.92); z-index:50; display:none; overflow-y:auto; padding:16px;}
.overlay.open{display:block;}
.pcard{max-width:520px; margin:12px auto 40px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px;}
.phead{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px;}
.pnm{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:22px;}
.close{background:none; border:none; color:var(--muted); font-size:28px; cursor:pointer; line-height:1; padding:0;}
.hit{display:flex; justify-content:space-around; text-align:center; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:14px 6px; margin:12px 0;}
.hpct{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:24px;}
.hlab{color:var(--muted); font-size:11px; margin-top:2px;}
.lineRow{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
.step{width:34px; height:34px; border-radius:7px; background:var(--card2); border:1px solid var(--line); color:var(--text); font-size:18px; cursor:pointer;}
.lineVal{font-family:'Rajdhani',sans-serif; font-weight:600; font-size:18px; min-width:50px; text-align:center;}
table.gl{width:100%; border-collapse:collapse; font-size:12px; white-space:nowrap;}
table.gl th{color:var(--muted); text-align:left; padding:4px 8px 4px 0; font-weight:500;}
table.gl td{padding:5px 8px 5px 0; border-top:1px solid var(--line);}
.edgebox{background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-top:12px; display:flex; align-items:center; gap:10px; justify-content:space-between;}
.edgebox input{width:90px;}

.gbar{margin:0 0 12px; padding:8px 10px 9px; background:var(--card); border:1px solid var(--line); border-radius:10px;}
.gbar-top{display:flex; align-items:center; gap:6px; margin-bottom:7px;}
.gbar-top .gt{font-size:12px; font-weight:600; color:var(--muted); flex:1; white-space:nowrap;}
.gbar-top .gt b{color:var(--text);}
.gbar-top select{width:auto; max-width:104px; padding:5px 6px; font-size:12px; border-radius:6px;}
.gbar-top button{font:inherit; font-size:12px; font-weight:600; padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card2); color:var(--muted); cursor:pointer; white-space:nowrap;}
.gchips{display:flex; flex-wrap:nowrap; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:1px;}
.gchips::-webkit-scrollbar{display:none;}
.gchip{flex:none; font:inherit; font-size:11.5px; font-weight:700; padding:5px 9px; border-radius:8px; border:1px solid var(--green); background:rgba(47,191,113,.14); color:var(--text); cursor:pointer; text-align:center; line-height:1.2; white-space:nowrap;}
.gchip small{display:block; font-weight:500; font-size:10px; color:var(--muted);}
.gchip.off{border-color:var(--line); background:var(--card2); color:var(--muted); opacity:.6;}
.gchip.off span{text-decoration:line-through;}
.pstats{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:8px 0 2px;}
.ps{min-width:0; background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:5px 2px 4px; text-align:center;}
.ps b{display:block; font-size:13px; line-height:1.15; white-space:nowrap;}
.ps span{display:block; font-size:8.5px; letter-spacing:.05em; font-weight:600; color:var(--muted); margin-top:2px; white-space:nowrap;}
.ptag{font-size:9.5px; font-weight:700; letter-spacing:.04em; padding:1px 6px; border-radius:999px; margin-left:7px; vertical-align:middle; border:1px solid currentColor;}
.tlink{width:100%; margin-top:10px; font:inherit; font-size:12px; font-weight:700; padding:8px 0; border-radius:8px; border:1px solid var(--line); background:var(--card2); color:var(--text); cursor:pointer; letter-spacing:.03em;}
.tlink:active{border-color:var(--amber);}
.hotwhy{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;}
.hw{font-size:10.5px; font-weight:700; letter-spacing:.03em; padding:3px 7px; border-radius:6px; background:var(--card2); border:1px solid var(--line); color:var(--muted);}
.hw.g{color:var(--green);} .hw.a{color:var(--amber);} .hw.b{color:var(--blue);} .hw.r{color:var(--red);}
.fline{margin-top:7px; font-size:11.5px; line-height:1.5; color:var(--muted);} .fline b{font-weight:600;} .fline .g{color:var(--green);} .fline .a{color:var(--amber);} .fline .bl,.fline .bl b{color:#6ea8ff;}
.fbar{display:flex; gap:2px; margin-top:7px;} .fbar i{display:block; width:9px; height:15px; border-radius:2px; background:var(--red); opacity:.8;} .fbar i.y{background:var(--green); opacity:1;}
/* Ice Cold Picks */
#bPicks{white-space:normal !important; line-height:1.05; font-size:13px !important;}
.slip{border-left:4px solid var(--line);}
.slip.is-pending{border-left-color:var(--amber);} .slip.is-hit{border-left-color:var(--green);} .slip.is-miss{border-left-color:var(--red);} .slip.is-void{border-left-color:var(--muted);}
.slip-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.st{font-size:10.5px; font-weight:700; letter-spacing:.4px; padding:3px 7px; border-radius:5px; white-space:nowrap; text-transform:uppercase;}
.st.is-pending{background:rgba(212,160,23,.15); color:var(--amber);} .st.is-hit{background:rgba(47,191,113,.15); color:var(--green);}
.st.is-miss{background:rgba(229,72,77,.15); color:var(--red);} .st.is-void{background:rgba(122,134,153,.15); color:var(--muted);}
.legs{margin-top:8px; border-top:1px solid var(--line);}
.leg{display:flex; align-items:center; gap:8px; padding:7px 0; font-size:13px;} .leg+.leg{border-top:1px solid var(--line);}
.leg i{flex:none; width:9px; height:9px; border-radius:50%; background:var(--amber);}
.leg i.is-hit{background:var(--green);} .leg i.is-miss{background:var(--red);} .leg i.is-void{background:var(--muted);}
.leg .lp{margin-left:auto; font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px;}
/* Ladder Challenge */
#bLadder{white-space:normal !important; line-height:1.05; font-size:13px !important;}
.rungs{display:flex; gap:5px; margin:10px 0 4px;}
.rung{flex:1; text-align:center; padding:7px 0; border-radius:7px; border:1px solid var(--line); background:var(--card2); font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; color:var(--muted);}
.rung.is-hit{background:rgba(47,191,113,.15); color:var(--green); border-color:var(--green);}
.rung.is-miss{background:rgba(229,72,77,.15); color:var(--red); border-color:var(--red);}
.rung.is-pending{background:rgba(212,160,23,.15); color:var(--amber); border-color:var(--amber);}
.lbig{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:26px; line-height:1.1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span style="white-space:nowrap">Ice Engine&nbsp;🧊⚙️</span></h1>
    <div class="updated"><div id="updated">Loading…</div><button class="reload" id="reload">Refresh</button></div>

/* ============ FITTED PLAYER MODELS (Assists o0.5, Shots o2.5) ============ */
// From backtest_player_props_v2.py. They use only this season's games and were
// tested on players with 10+ games, so until then the board uses the plain
// season-long hit rate (this season + last).
// Fitted player-prop models from backtest_player_props_v2.py
// (logistic regression, 2025-26 skater-games through 2026-01-31).
const ASSISTS_MODEL = {            // Assists over 0.5
  intercept: -3.277146,
  long: 0.527562,                  // logit of the shrunk season hit rate
  lnToiSeason: -0.161009,          // ln(average minutes, season)
  lnToiLast10: 1.140031            // ln(average minutes, last 10 games)
};
const SHOTS_MODEL = {              // Shots on goal over 2.5
  intercept: -1.248728,
  long: 0.605839,
  lnToiSeason: -0.592917,
  lnToiLast10: 0.976668,
  lnOppGa: 0.037397,               // ln(opponent blended GA / league goals per team-game)
  lnOppAtt: 2.257895,              // ln(opponent shot attempts allowed per game / league average)
  decay: 0.221963                  // logit of the decay-weighted hit rate (0.80 per game)
};
const PROP_SHRINK = 10;            // games of "what his average implies" mixed into the season rate
const DECAY_SHRINK = 5;            // same, for the decay-weighted rate
const DECAY = 0.80;                // each game further back counts 0.80 as much
const ATTEMPT_SHRINK = 10;         // games of league-average attempts mixed into the opponent's rate

function toiMinutes(toi) {         // "18:34" -> 18.5667
  const [m, s] = String(toi).split(':').map(Number);
  return m + s / 60;
}
function logit(p) {
  p = Math.min(Math.max(p, 1e-4), 1 - 1e-4);
  return Math.log(p / (1 - p));
}
function poissonAtLeast(mean, need) {   // P(X >= need), X ~ Poisson(mean)
  let below = 0, term = Math.exp(-mean);
  for (let i = 0; i < need; i++) { below += term; term *= mean / (i + 1); }
  return 1 - below;
}

// stats: the stat in each of the player's earlier games THIS season, oldest first.
// need: 1 for assists over 0.5, 3 for shots over 2.5.
// leagueMean: league average of the stat per skater-game, season to date.
function hitRates(stats, need, leagueMean) {
  const n = stats.length;
  const sum = stats.reduce((a, b) => a + b, 0);
  const hits = stats.filter(v => v >= need).length;
  // What his (shrunk) per-game average implies his hit rate should be.
  const implied = poissonAtLeast((sum + leagueMean * PROP_SHRINK) / (n + PROP_SHRINK), need);
  const longRate = (hits + implied * PROP_SHRINK) / (n + PROP_SHRINK);
  // Decay-weighted: newest game weight 1, the one before 0.80, then 0.64, ...
  let wHits = 0, w = 0;
  for (const v of stats) { wHits = wHits * DECAY + (v >= need ? 1 : 0); w = w * DECAY + 1; }
  const decayRate = (wHits + implied * DECAY_SHRINK) / (w + DECAY_SHRINK);
  return { longRate, decayRate };
}

// toi: "MM:SS" strings for the same earlier games, oldest first (needs 10+).
function toiInputs(toi) {
  const mins = toi.map(toiMinutes);
  const season = mins.reduce((a, b) => a + b, 0) / mins.length;
  const last10 = mins.slice(-10).reduce((a, b) => a + b, 0) / 10;
  return { lnSeason: Math.log(Math.max(1, season)), lnLast10: Math.log(Math.max(1, last10)) };
}

// Chance of 1+ assists. leagueAssists: league assists per skater-game, season to date.
function assistsOverChance(assists, toi, leagueAssists) {
  const m = ASSISTS_MODEL, r = hitRates(assists, 1, leagueAssists), t = toiInputs(toi);
  const z = m.intercept + m.long * logit(r.longRate) + m.lnToiSeason * t.lnSeason + m.lnToiLast10 * t.lnLast10;
  return 1 / (1 + Math.exp(-z));
}

// Chance of 3+ shots on goal. leagueSog: league shots per skater-game, season to date.
// opp = {
//   gaBlend:         opponent blended goals against per game (the board's blended(opp).ga)
//   leagueGoals:     league goals per team per game, season to date, shootout goal removed
//   attemptsAllowed: opponent shot attempts allowed per game, this season (team_attempts_allowed view)
//   games:           how many games that average covers
//   leagueAttempts:  league average shot attempts per team per game, this season
// }
function shotsOverChance(sog, toi, leagueSog, opp) {
  const m = SHOTS_MODEL, r = hitRates(sog, 3, leagueSog), t = toiInputs(toi);
  const oppAtt = (opp.attemptsAllowed * opp.games + opp.leagueAttempts * ATTEMPT_SHRINK) / (opp.games + ATTEMPT_SHRINK);
  const z = m.intercept + m.long * logit(r.longRate) + m.lnToiSeason * t.lnSeason + m.lnToiLast10 * t.lnLast10 +
            m.lnOppGa * Math.log(opp.gaBlend / opp.leagueGoals) +
            m.lnOppAtt * Math.log(oppAtt / opp.leagueAttempts) +
            m.decay * logit(r.decayRate);
  return 1 / (1 + Math.exp(-z));
}

const LEAGUE_ASSISTS=0.3057, LEAGUE_SOG=1.6104;   // full 2025-26 per skater-game, used as the league mean
const MODEL_MIN_GAMES=10;

/* ============ TEAM ENGINE ============ */
// Goals for/against per team from final scores. A shootout win is 1 goal
// inflated for the winner (the SO goal), so it is removed.
function buildTeamStats(){
  const t={};
  const get=(tm)=>t[tm]||(t[tm]={games:[]});
  S.finals.forEach(g=>{
    let a=g.away_score, h=g.home_score;
    if(g.last_period_type==='SO'){ if(a>h) a--; else h--; }
    get(g.away).games.push({date:g.game_date,season:g.season,gf:a,ga:h});
    get(g.home).games.push({date:g.game_date,season:g.season,gf:h,ga:a});
  });
  Object.values(t).forEach(x=>x.games.sort((p,q)=>p.date<q.date?-1:1));
  S.teamStats=t;
}
// League average goals per team per game (shootout-adjusted), only games before `day`.
function leagueAvg(day){
  let cur=0,curN=0,all=0,allN=0;
  Object.values(S.teamStats).forEach(x=>x.games.forEach(g=>{
    if(g.date>=day) return;
    all+=g.gf; allN++;
    if(g.season===CUR){ cur+=g.gf; curN++; }
  }));
  if(curN>=200) return cur/curN;
  return allN?all/allN:LEAGUE_AVG;
}
// Blended rate (last season counts as 15 games) and last-10 rate, using only games before `day`.
function rates(tm, day){
  const s=S.teamStats[tm];
  const gs=s?s.games.filter(g=>g.date<day):[];
  const prev=gs.filter(g=>g.season!==CUR), cur=gs.filter(g=>g.season===CUR);
  const sum=(arr,k)=>arr.reduce((a,g)=>a+g[k],0);
  const pgf=prev.length?sum(prev,'gf')/prev.length:LEAGUE_AVG, pga=prev.length?sum(prev,'ga')/prev.length:LEAGUE_AVG;
  const gf=(pgf*PRIOR_GAMES+sum(cur,'gf'))/(PRIOR_GAMES+cur.length);
  const ga=(pga*PRIOR_GAMES+sum(cur,'ga'))/(PRIOR_GAMES+cur.length);
  const l10=cur.slice(-10), miss=10-l10.length;
  return {gf,ga,gf10:(sum(l10,'gf')+miss*gf)/10, ga10:(sum(l10,'ga')+miss*ga)/10, gp:cur.length};
}
// Fitted team-goals model (Poisson regression on 2025-26 games, from backtest_team_totals.py)
const TEAM_MODEL={intercept:1.097460, gfBlend:0.649684, oppGaBlend:0.158471, gfLast10:-0.104467, oppGaLast10:0.137525, home:0.043517};
function projectGoals(gf,oppGa,gf10,oppGa10,isHome,L){
  const m=TEAM_MODEL, rel=v=>Math.log(Math.max(0.5,v)/L);
  return Math.exp(m.intercept+m.gfBlend*rel(gf)+m.oppGaBlend*rel(oppGa)+m.gfLast10*rel(gf10)+m.oppGaLast10*rel(oppGa10)+(isHome?m.home:0));
}
function chanceAtLeast(mean,k){
  let below=0, term=Math.exp(-mean);
  for(let i=0;i<k;i++){ below+=term; term*=mean/(i+1); }
  return 1-below;
}
function restFactor(tm, day){
  const s=S.teamStats[tm]; if(!s) return {label:'Unknown',days:null};
  const prior=s.games.filter(g=>g.date<day);
  if(!prior.length) return {label:'Season opener',days:null};
  const d=daysBetween(prior[prior.length-1].date, day);
  if(d>30) return {label:'Season opener',days:d};
  if(d<=1) return {label:'Back-to-back',days:d};
  return {label:`${d-1} day${d-1===1?'':'s'} off`,days:d};
}
// Starting goalie for a team on S.day: confirmed starter, else first goalie listed.
function startingGoalie(tm){
  const gs=S.lineups.filter(l=>l.team===tm && l.slot==='goalie' && l.status==='projected').sort((a,b)=>a.list_order-b.list_order);
  if(!gs.length) return null;
  return gs.find(g=>g.confirmed_starter)||gs[0];
}
function projectTeam(tm, opp, isHome){
  const L=leagueAvg(S.day), A=rates(tm,S.day), B=rates(opp,S.day), m=TEAM_MODEL;
  const rel=v=>Math.log(Math.max(0.5,v)/L);
  const proj=projectGoals(A.gf,B.ga,A.gf10,B.ga10,isHome,L);
  const steps=[['Base (league-average team)',m.intercept],['Team scoring (blended)',m.gfBlend*rel(A.gf)],[opp+' goals allowed (blended)',m.oppGaBlend*rel(B.ga)],['Team last 10 goals',m.gfLast10*rel(A.gf10)],[opp+' last 10 goals allowed',m.oppGaLast10*rel(B.ga10)],['Home ice',isHome?m.home:0]];
  let cum=0, prevVal=0; const contrib=steps.map(([lab,v],i)=>{ cum+=v; const val=Math.exp(cum); const d=i===0?val:val-prevVal; prevVal=val; return {lab,d}; });
  const g=startingGoalie(opp);
  const sv=g && g.player_id ? S.goalieSV.get(g.player_id) : null;
  return {tm,opp,proj,contrib,gp:A.gp,goalie:g,sv,rest:restFactor(tm,S.day),green:proj>=GREEN_LIGHT,
          p3:chanceAtLeast(proj,3),p4:chanceAtLeast(proj,4),p5:chanceAtLeast(proj,5)};
}

const LOG_COLS='player_id,game_id,season,game_date,team,opponent,home_road,goals,assists,points,sog,shot_attempts,shots_against,goals_against,toi';
async function loadLogs(ids, onlyGoalies=false){
  const need=ids.filter(id=>!S.logCache.has(id));
  const chunks=[]; for(let i=0;i<need.length;i+=12) chunks.push(need.slice(i,i+12));
  let idx=0;
  async function worker(){
    while(idx<chunks.length){
      const c=chunks[idx++];
      const extra=onlyGoalies?'&shots_against=not.is.null':'';
      const rows=await sbAll(`player_game_logs?player_id=in.(${c.join(',')})&game_type=eq.2&select=${LOG_COLS}&order=game_date.desc,game_id.desc${extra}`);
      const by={}; c.forEach(id=>by[id]=[]);
      const seen=new Set(); rows.forEach(r=>{ const k=r.player_id+'_'+r.game_id; if(seen.has(k)) return; seen.add(k); (by[r.player_id]||(by[r.player_id]=[])).push(r); });
      c.forEach(id=>S.logCache.set(id,by[id]));
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
}
async function loadGoalieSV(){
  const ids=[...new Set(S.lineups.filter(l=>l.slot==='goalie'&&l.player_id).map(l=>l.player_id))];
  if(!ids.length) return;
  await loadLogs(ids,true);
  ids.forEach(id=>{
    const rows=(S.logCache.get(id)||[]).filter(r=>r.shots_against!=null);
    let sa=0, ga=0;
    rows.forEach(r=>{ sa+=r.shots_against; ga+=r.goals_against||0; });
    // shrink toward league average so a tiny sample can't swing the number
    const K=400;
    S.goalieSV.set(id, ((sa-ga)+LEAGUE_SV*K)/(sa+K));
  });
}

function applyGameFilter(){

/* ---- stats from logs ---- */
function statVal(r,stat){
  if(stat==='Saves') return r.shots_against!=null ? r.shots_against-(r.goals_against||0) : null;
  return r[STATS[stat].col];
}
function filterRows(rows, o){
  let r=rows.slice();
  if(o.split==='Home') r=r.filter(x=>x.home_road==='H');
  if(o.split==='Away') r=r.filter(x=>x.home_road==='R');
  if(o.vs) r=r.filter(x=>x.opponent===o.vs);
  if(o.vs) return r;                       // head-to-head ignores the timeframe: every meeting we have
  if(o.window==='Season') r=r.filter(x=>x.season===CUR);
  else if(o.window!=='All-time') r=r.slice(0,parseInt(o.window.split(' ')[1],10));
  return r;
}
function hitStats(rows, stat, line){
  const v=rows.map(r=>statVal(r,stat)).filter(x=>x!=null);
  const n=v.length, over=v.filter(x=>x>line).length;
  return {n, over, under:n-over, pct:n?over/n:0, avg:n?v.reduce((a,b)=>a+b,0)/n:0};
}

/* ---- Top Plays ---- */
async function renderTop(){
  if((S.topStat||'best')==='plus') return renderPlus();
  const gs=dayGames();
  if(!gs.length){ $('view').innerHTML=`<div class="empty">${dayGamesAll().length?'Every game is hidden. Tap a game above, or Show all.':'No games on this day.'}</div>`; return; }
  if(!S.lineups.length){ $('view').innerHTML='<div class="empty">Lineups for this day aren\'t posted yet.</div>'; return; }
  $('view').innerHTML='<div class="empty">Crunching real game logs…</div>';
  const green=[];
  gs.forEach(g=>{
    const a=projectTeam(g.away,g.home,false), h=projectTeam(g.home,g.away,true);
    if(a.green) green.push(a); if(h.green) green.push(h);
  });
  if(!green.length){ $('view').innerHTML='<div class="empty">No team clears the green light today, so no player props qualify.</div>'; return; }
  await loadAttempts();
  if(!S.topRows){
    const skaters=S.lineups.filter(l=>green.some(p=>p.tm===l.team) && l.status==='projected' && (l.slot==='line'||l.slot==='pair') && l.player_id);
    await loadLogs([...new Set(skaters.map(s=>s.player_id))]);
    const rows=[];
    skaters.forEach(s=>{
      const logs=S.logCache.get(s.player_id)||[];
      ['Points','Goals','Assists','Shots'].forEach(stat=>{
        const line=STATS[stat].line;
        const all=hitStats(logs,stat,line), l10=hitStats(logs.slice(0,10),stat,line);
        if(all.n<15) return;
        rows.push({s,stat,line,all,l10,tm:s.team});
      });
    });
    const pool={};
    ['Points','Goals','Assists','Shots'].forEach(st=>{ const r=rows.filter(x=>x.stat===st); const o=r.reduce((a,x)=>a+x.all.over,0), n=r.reduce((a,x)=>a+x.all.n,0); pool[st]=n?o/n:0.3; });
    rows.forEach(r=>{
      r.rate=(r.all.over+SHRINK_K*pool[r.stat])/(r.all.n+SHRINK_K);
      const tp=green.find(x=>x.tm===r.tm), mc=modelChance(r.s.player_id,r.stat,r.line,tp?tp.opp:'');
      if(mc!=null){ r.rate=mc; r.model=true; }
    });
    S.topRows=rows;
  }
  const statSel=S.topStat||'best';
  // ---- priced plays (Points / Assists with real book prices) ----
  const skaterIds=new Set(S.lineups.filter(l=>green.some(p=>p.tm===l.team)&&l.status==='projected'&&(l.slot==='line'||l.slot==='pair')&&l.player_id).map(l=>l.player_id));
  const poolMemo={};
  const poolFor=(stat,line)=>{ const k=stat+'|'+line; if(poolMemo[k]!=null) return poolMemo[k]; let o=0,n=0; skaterIds.forEach(id=>{ const h=hitStats(S.logCache.get(id)||[],stat,line); o+=h.over; n+=h.n; }); return poolMemo[k]=n?o/n:0.3; };
  const groups=new Map();
  (S.odds||[]).forEach(o=>{
    const stat=MARKET_STAT[o.market]; if(!stat||!o.player_id||!skaterIds.has(o.player_id)) return;
    const k=o.player_id+'|'+stat+'|'+o.line; if(!groups.has(k)) groups.set(k,{pid:o.player_id,stat,line:+o.line,prices:[]});
    groups.get(k).prices.push({price:o.price,book:o.book});
  });
  const lineupBy=new Map(); S.lineups.forEach(l=>{ if(l.player_id) lineupBy.set(l.player_id,l); });
  const covered=new Set(); // player|stat combos that have any price today
  let priced=[];
  groups.forEach(gp=>{
    covered.add(gp.pid+'|'+gp.stat);
    const logs=S.logCache.get(gp.pid)||[];
    const all=hitStats(logs,gp.stat,gp.line), l10=hitStats(logs.slice(0,10),gp.stat,gp.line);
    if(all.n<15) return;
    let rate=(all.over+SHRINK_K*poolFor(gp.stat,gp.line))/(all.n+SHRINK_K), model=false;
    { const lt=lineupBy.get(gp.pid), tpp=lt?green.find(x=>x.tm===lt.team):null, mc=modelChance(gp.pid,gp.stat,gp.line,tpp?tpp.opp:''); if(mc!=null){ rate=mc; model=true; } }
    const sorted=gp.prices.slice().sort((x,y)=>x.price-y.price);
    const ps=sorted.map(x=>x.price), bestBook=sorted[sorted.length-1].book;
    const best=ps[ps.length-1], worst=ps[0], mid=ps[Math.floor(ps.length/2)];
    if(best<FLOOR_BY_STAT[gp.stat]) return;
    const edge=(rate-impliedProb(mid))*100;
    if(edge<=0) return;
    const l=lineupBy.get(gp.pid);
    const tp=green.find(x=>x.tm===l.team);
    priced.push({s:l,stat:gp.stat,line:gp.line,all,l10,rate,model,best,worst,mid,edge,n:ps.length,tm:l.team,bestBook,teamProj:tp?tp.proj:null,opp:tp?tp.opp:''});
  });
  priced=priced.filter(r=>statSel==='best'||r.stat===statSel);
  const bestBy=new Map(); priced.forEach(r=>{ const k=r.s.player_id+(statSel==='best'?'':r.stat); if(!bestBy.has(k)||r.edge>bestBy.get(k).edge) bestBy.set(k,r); });
  priced=[...bestBy.values()].sort((a,b)=>b.edge-a.edge).slice(0,30);
  const oddsTime=(S.odds||[]).map(o=>o.updated_at).sort().pop();
  const bookShort=b=>({DraftKings:'DK',FanDuel:'FD',BetMGM:'MGM','BetOnline.ag':'BetOnline',Bovada:'Bovada'}[b]||b);
  const priceTxt=r=>`<b style="color:var(--text)">Best ${fmtOdds(r.best)}</b> ${esc(bookShort(r.bestBook))}`;
  const pricedHTML=priced.map(r=>`<div class="prow" data-pid="${r.s.player_id}" data-stat="${r.stat}" data-line="${r.line}" data-odds="${r.mid}">
      <div><div class="pname">${esc(r.s.player_name)}</div><div class="pmeta">${esc(r.tm)} · ${r.stat} o${r.line} · ${priceTxt(r)}</div><div class="pmeta">${r.model?'Model chance':'Hit rate'} ${Math.round(r.rate*100)}% (${r.all.over}/${r.all.n}) · fair ${fmtOdds(fairOdds(r.rate))}${r.best===r.worst?'':` · worst book ${fmtOdds(r.worst)}`}</div><div class="pmeta">Team projection ${r.teamProj!=null?r.teamProj.toFixed(2)+' goals vs '+esc(r.opp):'—'}</div></div>
      <div><div class="pbig" style="color:var(--green)">+${r.edge.toFixed(1)}</div><div class="psub">EDGE</div></div></div>`).join('');
  const priceNote=(S.odds&&S.odds.length)?`Prices as of ${new Date(oddsTime).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'})} ET. Shows the best book price; edge uses the middle price across books. Points and assists worse than -140 (goals, -160) are hidden.`:'Prices for Points and Assists load once a day around 4 PM ET. None are in yet.';

  // ---- hit-rate list (everything else, or no price yet) ----
  const plusMoney=(statSel==='Goals'||statSel==='Shots');
  let rows=S.topRows.filter(r=>(plusMoney||r.rate>=MIN_PLAY_HIT) && (statSel==='best'?r.stat!=='Goals':r.stat===statSel) && !covered.has(r.s.player_id+'|'+r.stat));
  if(statSel==='best'){          // one best prop per player
    const best=new Map();
    rows.forEach(r=>{ const k=r.s.player_id; if(!best.has(k)||r.rate>best.get(k).rate) best.set(k,r); });
    rows=[...best.values()];
  }
  rows.sort((a,b)=>b.rate-a.rate);
  rows=rows.slice(0,plusMoney?25:40);
  const filter=`<div class="row" style="grid-template-columns:1fr;"><div><label>Stat</label><select id="topStat">${['best','plus','Points','Goals','Assists','Shots'].map(x=>`<option value="${x}" ${x===statSel?'selected':''}>${x==='best'?'Best prop (auto)':(x==='plus'?'Plus-money finder (all teams)':x)}</option>`).join('')}</select></div></div>`;
  const note=`<div class="muted small" style="margin-bottom:10px;">Only players on green-lit teams (${green.map(g=>g.tm).join(', ')}). Ranked by season-long hit rate (this season plus last, the one measure that predicted in testing).</div>`;
  const list=rows.length?rows.map(r=>{
    const fo=fairOdds(r.rate);
    return `<div class="prow" data-pid="${r.s.player_id}" data-stat="${r.stat}">
      <div><div class="pname">${esc(r.s.player_name)}</div><div class="pmeta">${esc(r.tm)} · ${r.stat} o${r.line} · L10 ${r.l10.over}/${r.l10.n}${r.model?' · MODEL':''}</div></div>
      <div><div class="pbig" style="color:var(--green)">${Math.round(r.rate*100)}%</div><div class="psub">${r.all.over}/${r.all.n} · fair ${fmtOdds(fo)}</div></div></div>`;
  }).join(''):'<div class="empty">Nothing else clears the bar today.</div>';
  const hdr=(t,sub)=>`<div class="section-label" style="margin:14px 0 6px;">${t}</div>${sub?`<div class="muted small" style="margin-bottom:8px;">${sub}</div>`:''}`;
  $('view').innerHTML=filter+note+
    (priced.length?hdr('PRICED PLAYS',priceNote)+pricedHTML:((S.odds&&S.odds.length)?hdr('PRICED PLAYS',priceNote)+'<div class="empty">No priced play beats its break-even today.</div>':hdr('PRICED PLAYS',priceNote)))+
    hdr('HIT RATE ONLY',plusMoney?`${statSel} pay plus money, so there's no minimum hit rate here. Ranked by season-long hit rate. Take it only if your book pays better than the fair price.`:`${Math.round(MIN_PLAY_HIT*100)}%+ (break-even of −140). Fair price is what the rate is worth — compare it to your book.`)+list;
  $('topStat').onchange=e=>{ S.topStat=e.target.value; renderTop(); };
}


/* ---- Plus-money finder: every team, no green-light gate, prices +100 or better ---- */
async function renderPlus(){
  const sel=`<div class="row" style="grid-template-columns:1fr;"><div><label>Stat</label><select id="topStat">${['best','plus','Points','Goals','Assists','Shots'].map(x=>`<option value="${x}" ${x==='plus'?'selected':''}>${x==='best'?'Best prop (auto)':(x==='plus'?'Plus-money finder (all teams)':x)}</option>`).join('')}</select></div></div>`;
  const wire=()=>{ $('topStat').onchange=e=>{ S.topStat=e.target.value; renderTop(); }; };
  if(!S.odds||!S.odds.length){
    $('view').innerHTML=sel+'<div class="empty">No prices yet. They load once a day around 4 PM ET, and this view needs them.</div>'; wire(); return;
  }
  $('view').innerHTML=sel+'<div class="empty">Checking every priced player against his real game log…</div>'; wire();
  await loadAttempts();
  const ids=[...new Set(S.odds.filter(o=>MARKET_STAT[o.market]&&o.player_id).map(o=>o.player_id))];
  await loadLogs(ids);
  const groups=new Map();
  S.odds.forEach(o=>{
    const stat=MARKET_STAT[o.market]; if(!stat||!o.player_id) return;
    const k=o.player_id+'|'+stat+'|'+o.line; if(!groups.has(k)) groups.set(k,{pid:o.player_id,stat,line:+o.line,prices:[]});

function patPeriod(seq){ // newest first, 1=hit. Repeating hit/miss rhythm (period 2-6, 75%+ match). next = what the same cycle says for tonight
  const L=seq.length; if(L<12) return null;
  const h=seq.reduce((a,b)=>a+b,0)/L; if(h<0.2||h>0.85) return null;
  let best=null;
  for(let p=2;p<=6;p++){
    if(L<3*p||new Set(seq.slice(0,p)).size<2) continue;
    let m=0; for(let i=0;i<L-p;i++) if(seq[i]===seq[i+p]) m++;
    const fit=m/(L-p); if(fit>=0.75&&(!best||fit>best.fit)) best={p,fit,next:seq[p-1]};
  }
  return best;
}

/* ---- scoring profile: how often he scores, and how: volume or sniper (this + last season, regular season) ---- */
function scoreProfile(logs){
  const g=logs.filter(r=>r.goals!=null);
  const n=g.length; if(n<10) return null;
  const gg=g.filter(r=>r.goals>0).length;
  const goals=g.reduce((a,r)=>a+(r.goals||0),0);
  const sog=g.reduce((a,r)=>a+(r.sog||0),0);
  const wa=g.filter(r=>r.shot_attempts!=null);
  const att=wa.length?wa.reduce((a,r)=>a+r.shot_attempts,0)/wa.length:null;
  const last10=g.slice(0,10).reduce((a,r)=>a+(r.goals||0),0);
  return {n,gg,every:gg?n/gg:null,goals,sog,shootPct:sog?goals/sog:null,sogPg:sog/n,att,last10};
}
function profTag(f){
  if(!f) return '';
  if(f.shootPct!=null&&f.sog>=50&&f.shootPct>=0.16&&f.sogPg<2.6) return '<span class="ptag" style="color:var(--amber)">SNIPER</span>';
  if(f.sogPg>=3.0) return '<span class="ptag" style="color:var(--blue)">VOLUME</span>';
  return '';
}
function profStrip(f){
  if(!f) return '';
  const cell=(v,l,c)=>`<div class="ps"><b${c?` style="color:${c}"`:''}>${v}</b><span>${l}</span></div>`;
  return `<div class="pstats">${cell(f.every?`1 in ${f.every.toFixed(1)}`:`0 in ${f.n}`,'SCORES')}${cell(f.shootPct!=null?Math.round(f.shootPct*100)+'%':'–','SHOOT %',f.shootPct!=null&&f.sog>=50&&f.shootPct>=0.16?'var(--amber)':'')}${cell(f.sogPg.toFixed(1),'SHOTS/G',f.sogPg>=3.0?'var(--blue)':'')}${cell(f.att!=null?f.att.toFixed(1):'–','ATT/G')}${cell(f.last10,'GOALS L10')}</div>`;
}


/* ============ HOT TONIGHT: form + role, not just edge ============ */
S.hot=S.hot||{stat:'Goals',price:'any',sort:'edge'};
function avgToiMin(logs){
  let r=logs.filter(x=>x.season===CUR&&x.toi); if(r.length<5) r=logs.filter(x=>x.toi);
  r=r.slice(0,25); if(!r.length) return null;
  return r.reduce((a,x)=>a+toiMinutes(x.toi),0)/r.length;
}
function roleBucket(pos,toi){
  if(toi==null) return null;
  if(pos==='D') return toi<18.5?'D1':(toi<21.5?'D2':'D3');
  return toi<12.5?'F1':(toi<15.5?'F2':(toi<18?'F3':'F4'));
}
const ROLE_NAME={F1:'bottom six, low minutes',F2:'third line minutes',F3:'second line minutes',F4:'top line minutes',D1:'depth D',D2:'middle pair D',D3:'top pair D'};
function dueInfo(logs,stat){
  const g=logs.filter(r=>statVal(r,stat)!=null);
  const n=g.length; if(n<15) return null;
  const hits=g.filter(r=>statVal(r,stat)>0.5).length; if(!hits) return null;
  const usual=n/hits;                                  // usual games between hits
  const w=g.slice(0,30);
  let m=w.findIndex(r=>statVal(r,stat)>0.5); if(m<0) m=w.length;   // current miss streak
  let maxGap=m, last=m;
  for(let i=m+1;i<w.length;i++){ if(statVal(w[i],stat)>0.5){ maxGap=Math.max(maxGap,i-last-1); last=i; } }
  const steady=maxGap<=Math.max(3,Math.ceil(2*usual));   // no drought much longer than twice his usual gap
  const due=m>=1&&m>=Math.round(usual)-1&&steady&&hits/n>=0.3;
  return {usual,m,steady,maxGap,due,rate:hits/n};
}

// The file holds no money or boosts on purpose (it is public): just slip

    const legs=(d.legs||[]).map(l=>`<div class="leg"><i class="is-${esc(st(l.result))}"></i><div><b>${esc(l.player)}</b> <span class="muted">${esc(l.team||'')}</span><div class="muted small">${esc(l.market||'')}</div></div><span class="lp">${esc(l.price||'')}</span></div>`).join('');
    const pay=d.status!=='miss'&&d.payout!=null?` → ${money(d.payout)}`:'';
    return `<div class="card slip is-${k}"><div class="slip-head"><div><div class="pname">Day ${esc(d.day)}${d.date?` <span class="muted small">${esc(new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}))}</span>`:''}</div><div class="pmeta">${esc(d.book||'')} · ${(d.legs||[]).length} leg${(d.legs||[]).length===1?'':'s'} · ${esc(d.odds||'')} · ${money(+d.stake||0)}${pay}</div></div><span class="st is-${k}">${k}</span></div>${legs?`<div class="legs">${legs}</div>`:''}</div>`;
  };
  const days=daysOf(cur);
  const missed=days.find(d=>d.status==='miss');
  const done=days.length===7&&days[6].status==='hit';
  let bal=start; days.forEach(d=>{ if(d.status==='hit'&&d.payout!=null) bal=+d.payout; });
  const open=days.find(d=>st(d.status)==='pending');
  const rungs=Array.from({length:7},(_,i)=>{ const d=days.find(x=>x.day===i+1); return `<div class="rung ${d?'is-'+st(d.status):''}">${i+1}</div>`; }).join('');
  let banner;
  if(done) banner=`<div class="lbig" style="color:var(--green)">Ladder complete: ${money(bal)}</div>`;
  else if(missed) banner=`<div class="lbig" style="color:var(--red)">Ended on Day ${esc(missed.day)}</div><div class="muted small">The next attempt restarts at ${money(start)} with the next pick.</div>`;
  else banner=`<div class="lbig">${money(bal)}</div><div class="muted small">${open?`Day ${esc(open.day)} is live`:`Day ${days.length+1} of 7 next`} · rolling the full payout each day</div>`;
  const head=`<div class="card"><div class="muted small" style="letter-spacing:.06em;font-weight:700;">ATTEMPT ${esc(cur.attempt)} · START ${money(start)} · GOAL ${money(lo)} TO ${money(hi)} IN 7 DAYS</div>${banner}<div class="rungs">${rungs}</div><div class="muted small">1 or 2 legs a day. Aiming for +100 or better, best price shopped.</div></div>`;
  let pick;
  if(open) pick=`<div class="section-label">TODAY'S PICK</div>${dcard(open)}`;
  else if(!missed&&!done) pick=`<div class="section-label">TODAY'S PICK</div><div class="empty">Day ${days.length+1} pick is not posted yet. Picks go up once approved.</div>`;
  else pick='';
  const prev=days.filter(d=>d!==open).reverse();
  const prevHtml=prev.length?`<div class="section-label">PREVIOUS DAYS</div>${prev.map(dcard).join('')}`:'';
  const past=attempts.slice(0,-1).reverse();
  const pastHtml=past.length?`<details class="more"><summary>Past attempts (${past.length})</summary>${past.map(a=>{const ds=daysOf(a); const m=ds.find(d=>d.status==='miss'); return `<div class="section-label">ATTEMPT ${esc(a.attempt)} · ${m?'ENDED DAY '+esc(m.day):(ds.length===7&&ds[6].status==='hit'?'COMPLETE':'OPEN')}</div>${ds.map(dcard).join('')}`;}).join('')}</details>`:'';
  $('view').innerHTML=head+pick+prevHtml+pastHtml;
}

/* ============ PLAYER MODAL ============ */
const M={};
async function openPlayer(pid, stat, line, odds, split, vsTeam, win){
  const p=S.players.get(pid)||{id:pid,name:'Player',team:'',pos:''};
  M.p=p; M.isG=p.pos==='G';
  M.stat=stat||(M.isG?'Saves':'Points'); M.window=win||(stat?'All-time':'Last 10'); M.split=split||'Home+Away'; M.vs=vsTeam||'';
  M.line=line!=null?line:(M.isG?24.5:STATS[M.stat].line); M.odds=odds!=null?String(odds):'';
  $('overlay').classList.add('open');
  $('pcard').innerHTML='<div class="empty">Loading game logs…</div>';
  try{
    if(!S.logCache.has(pid)) await loadLogs([pid]);
    M.logs=S.logCache.get(pid)||[];
    // suggest today's opponent for head-to-head
    const g=dayGames().find(x=>x.away===p.team||x.home===p.team);
    M.todayOpp=g?(g.away===p.team?g.home:g.away):'';
    drawPlayer();
  }catch(e){ $('pcard').innerHTML=`<div class="err">${esc(e.message)}</div><button class="close" onclick="closePlayer()">×</button>`; }
}
function closePlayer(){ $('overlay').classList.remove('open'); }
function drawPlayer(){
  const stats=M.isG?['Saves']:Object.keys(STATS);
  const rows=filterRows(M.logs,M);
  const h=hitStats(rows,M.stat,M.line);
  const opps=[...new Set(M.logs.map(r=>r.opponent))].sort();
  const vals=rows.map(r=>statVal(r,M.stat)).filter(x=>x!=null);
  // chart: oldest -> newest, left to right
  const items=rows.map(r=>({v:statVal(r,M.stat),r})).filter(o=>o.v!=null).slice(0,30).reverse();
  const n=items.length, dense=n>14, vdense=n>24;
  const mx=Math.max(Math.ceil(M.line+0.5),...items.map(o=>o.v),2), PH=128;
  const gstep=Math.max(1,Math.ceil(mx/4)); const grids=[]; for(let g=0;g<=mx;g+=gstep) grids.push(g);
  const md=d=>{const p=d.slice(5).split('-');return (+p[0])+'/'+(+p[1]);};
  const lineCtl=`<div class="chead"><span>Over line</span><div class="stp"><button class="step" id="mMinus" aria-label="lower line">−</button><b>${M.line}</b><button class="step" id="mPlus" aria-label="raise line">+</button></div></div>`;
  const svg=n?`<div class="chart2">${lineCtl}<div class="plot" style="height:${PH+22}px;">
      ${grids.map(g=>`<div class="grid" style="bottom:${(g/mx)*PH}px;"><span>${g}</span></div>`).join('')}
      <div class="lineMark" style="bottom:${(M.line/mx)*PH}px;"><span>o${M.line}</span></div>
      ${items.map((o,k)=>{const bh=Math.max(4,(o.v/mx)*PH); const sep=(k>0&&o.r.season!==items[k-1].r.season)?'<div class="ysep"></div>':''; return sep+`<div class="cb"><em ${vdense?'style="display:none"':''}>${o.v}</em><i style="height:${bh}px;background:${o.v>M.line?'var(--green)':'var(--red)'}"></i></div>`;}).join('')}
    </div>
    ${dense?`<div class="cax"><span>${md(items[0].r.game_date)}</span><span>${md(items[n-1].r.game_date)}</span></div>`:`<div class="clab">${items.map(o=>`<div><b>${md(o.r.game_date)}</b><span>${o.r.home_road==='H'?'':'@'}${esc(o.r.opponent)}</span></div>`).join('')}</div>`}
    <div class="cleg"><span><i style="background:var(--green)"></i>Over ${M.line}</span><span><i style="background:var(--red)"></i>Under</span><span><u></u>Line</span><span class="muted">Oldest → newest${h.n>30?` · chart shows last 30 of ${h.n}`:''}</span></div></div>`:'';
  const gamesById=new Map(S.games.map(g=>[g.id,g]));
  const glRows=rows.slice(0,25).map(r=>{
    const g=gamesById.get(r.game_id); let res='';
    if(g&&g.away_score!=null){ const mine=r.team===g.home?g.home_score:g.away_score, th=r.team===g.home?g.away_score:g.home_score; res=(mine>th?'W ':'L ')+mine+'-'+th; }
    const v=statVal(r,M.stat);
    return `<tr><td>${fmtDate(r.game_date)}</td><td>${r.home_road==='H'?'vs':'@'} ${esc(r.opponent)}</td><td>${res}</td><td style="text-align:right;font-weight:700;color:${v==null?'var(--muted)':(v>M.line?'var(--green)':'var(--red)')}">${v==null?'—':v}</td></tr>`;
  }).join('');
  const odds=parseFloat(M.odds);
  let edge='';
  if(!isNaN(odds)){
    const e=(h.pct-impliedProb(odds))*100;
    edge=`<div style="text-align:right"><div class="pbig" style="color:${e>=0?'var(--green)':'var(--red)'}">${e>=0?'+':''}${e.toFixed(1)}</div><div class="psub">${odds<-160?'Worse than −160 — pass':'edge vs break-even '+(impliedProb(odds)*100).toFixed(1)+'%'}</div></div>`;
  }
  const missing=M.stat==='Shot Attempts' && rows.some(r=>r.shot_attempts==null);
  $('pcard').innerHTML=`
    <div class="phead"><div><div class="pnm">${esc(M.p.name)}</div><div class="muted small">${esc(M.p.team)} · ${esc(M.p.pos)} · #${esc(M.p.number??'--')}</div></div><button class="close" id="mClose">&times;</button></div>
    <div class="chips" id="mStats">${stats.map(x=>`<button class="mc ${x===M.stat?'on':''}" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="ou">
      <div class="ourow"><span class="oul">Over</span><span class="oup" style="color:var(--green)">${h.n?(h.pct*100).toFixed(1)+'%':'--'}</span><span class="oun">${h.over}/${h.n}</span><span class="muted small" style="margin-left:6px;">avg ${h.n?h.avg.toFixed(2):'--'}</span>${!isNaN(parseFloat(M.odds))?`<span class="oupr">${fmtOdds(parseFloat(M.odds))}</span>`:''}</div>
    </div>
    ${h.n?svg:'<div class="chart2">'+lineCtl+'<div class="empty">No games match this filter.</div></div>'}
    <div class="chips" id="mWins" style="margin-top:12px;">${['Last 5','Last 10','Last 20','Season','All-time'].map(x=>`<button class="mc ${x===M.window&&!M.vs?'on':''}" data-v="${x}" ${M.vs?'disabled':''}>${x}</button>`).join('')}</div>
    ${M.vs?`<div class="muted small" style="margin-top:6px;">Showing every ${esc(M.vs)} meeting on file. Timeframe is ignored.</div>`:''}
    <div class="flab">Venue</div>
    <div class="chips" id="mSplits">${[['Home+Away','All games'],['Home','Home'],['Away','Away']].map(([v,t])=>`<button class="mc ${v===M.split?'on':''}" data-v="${v}">${t}</button>`).join('')}</div>
    <div class="flab">Opponent</div>
    <div class="chips" id="mVsC"><button class="mc ${!M.vs?'on':''}" data-v="">Any</button>${M.todayOpp?`<button class="mc ${M.vs===M.todayOpp?'on':''}" data-v="${esc(M.todayOpp)}">vs ${esc(M.todayOpp)} (tonight)</button>`:''}
      <select id="mVs" class="mini"><option value="">Other team…</option>${opps.filter(o=>o!==M.todayOpp).map(o=>`<option ${o===M.vs?'selected':''}>${o}</option>`).join('')}</select></div>
    ${missing?'<div class="muted small" style="margin-top:8px;">Some older games have no shot-attempt data yet — they\'re skipped.</div>':''}
    <div style="font-weight:700;font-size:14px;margin:16px 0 2px;">Gamelog</div>
    <div class="muted small" style="margin-bottom:6px;">${M.vs?`Every ${esc(M.vs)} meeting we have on file (regular season, ${h.n} games)`:'Regular season only'}</div>
    <div style="overflow-x:auto;"><table class="gl"><thead><tr><th>Date</th><th>Vs</th><th>Result</th><th style="text-align:right">${esc(M.stat)}</th></tr></thead><tbody>${glRows}</tbody></table></div>`;
  $('mClose').onclick=closePlayer;
  document.querySelectorAll('#mStats .mc').forEach(b=>b.onclick=()=>{ M.stat=b.dataset.v; if(!M.isG) M.line=STATS[M.stat].line; drawPlayer(); });
  document.querySelectorAll('#mWins .mc').forEach(b=>b.onclick=()=>{ M.window=b.dataset.v; drawPlayer(); });
  document.querySelectorAll('#mSplits .mc').forEach(b=>b.onclick=()=>{ M.split=b.dataset.v; drawPlayer(); });
  document.querySelectorAll('#mVsC .mc').forEach(b=>b.onclick=()=>{ M.vs=b.dataset.v; drawPlayer(); });
  $('mVs').onchange=e=>{ M.vs=e.target.value; drawPlayer(); };
  $('mMinus').onclick=()=>{ M.line=Math.max(0.5,M.line-1); drawPlayer(); };
  $('mPlus').onclick=()=>{ M.line=M.line+1; drawPlayer(); };
}


/* ============ TEAM TRENDS MODAL ============ */
const T={};
const T_LINES={'Team Total':2.5,'Game Total':5.5,'Moneyline':0};
function teamLogRows(tm){
  const out=[];
  S.finals.forEach(g=>{
    if(g.away!==tm&&g.home!==tm) return;
    const a=g.away_score, h=g.home_score;
    let aa=a, hh=h; if(g.last_period_type==='SO'){ if(aa>hh) aa--; else hh--; }   // shootout goal is not a real goal
    const home=g.home===tm;
    const rawFor=home?h:a, rawAg=home?a:h;
    out.push({game_id:g.id,season:g.season,game_date:g.game_date,home_road:home?'H':'R',opponent:home?g.away:g.home,
      gf:home?hh:aa, ga:home?aa:hh, win:rawFor>rawAg?1:0, rawFor, rawAg, ot:g.last_period_type});
  });
  out.sort((x,y)=>x.game_date<y.game_date?1:(x.game_date>y.game_date?-1:(y.game_id-x.game_id)));
  return out;
}
function openTeam(tm,opp){
  T.tm=tm; T.stat='Team Total'; T.line=T_LINES['Team Total']; T.window='Last 10'; T.split='Home+Away'; T.vs=''; T.odds=''; T.todayOpp=opp||'';
  T.logs=teamLogRows(tm);
  $('overlay').classList.add('open');
  drawTeam();
}
function drawTeam(){
  const ml=T.stat==='Moneyline';
  const val=r=>T.stat==='Team Total'?r.gf:(T.stat==='Game Total'?r.gf+r.ga:r.gf);   // bar height
  const hit=r=>ml?r.win===1:val(r)>T.line;
  const rows=filterRows(T.logs,T);
  const n=rows.length, over=rows.filter(hit).length, pct=n?over/n:0;
  const avg=n?rows.reduce((a,r)=>a+val(r),0)/n:0;
  const avgOpp=n?rows.reduce((a,r)=>a+r.ga,0)/n:0;
  const opps=[...new Set(T.logs.map(r=>r.opponent))].sort();
  const items=rows.slice(0,30).reverse();
  const m=items.length, dense=m>14, vdense=m>24;
  const mx=Math.max(ml?2:Math.ceil(T.line+0.5),...items.map(val),2), PH=128;
  const gstep=Math.max(1,Math.ceil(mx/4)); const grids=[]; for(let g=0;g<=mx;g+=gstep) grids.push(g);
  const md=d=>{const q=d.slice(5).split('-');return (+q[0])+'/'+(+q[1]);};
  const word=ml?'Win':'Over '+T.line;
  const lineCtl=ml?`<div class="chead"><span>Bars = goals scored · green = win, red = loss</span></div>`:`<div class="chead"><span>Over line</span><div class="stp"><button class="step" id="tMinus" aria-label="lower line">−</button><b>${T.line}</b><button class="step" id="tPlus" aria-label="raise line">+</button></div></div>`;
  const svg=m?`<div class="chart2">${lineCtl}<div class="plot" style="height:${PH+22}px;">
      ${grids.map(g=>`<div class="grid" style="bottom:${(g/mx)*PH}px;"><span>${g}</span></div>`).join('')}
      ${ml?'':`<div class="lineMark" style="bottom:${(T.line/mx)*PH}px;"><span>o${T.line}</span></div>`}
      ${items.map((o,k)=>{const v=val(o); const bh=Math.max(4,(v/mx)*PH); const sep=(k>0&&o.season!==items[k-1].season)?'<div class="ysep"></div>':''; return sep+`<div class="cb"><em ${vdense?'style="display:none"':''}>${v}</em><i style="height:${bh}px;background:${hit(o)?'var(--green)':'var(--red)'}"></i></div>`;}).join('')}
    </div>
    ${dense?`<div class="cax"><span>${md(items[0].game_date)}</span><span>${md(items[m-1].game_date)}</span></div>`:`<div class="clab">${items.map(o=>`<div><b>${md(o.game_date)}</b><span>${o.home_road==='H'?'':'@'}${esc(o.opponent)}</span></div>`).join('')}</div>`}
    <div class="cleg"><span><i style="background:var(--green)"></i>${ml?'Win':'Over '+T.line}</span><span><i style="background:var(--red)"></i>${ml?'Loss':'Under'}</span>${ml?'':'<span><u></u>Line</span>'}<span class="muted">Oldest → newest${n>30?` · chart shows last 30 of ${n}`:''}</span></div></div>`:'';
  const odds=parseFloat(T.odds);
  let edge='';
  if(!isNaN(odds)){
    const e=(pct-impliedProb(odds))*100;
    edge=`<div style="text-align:right"><div class="pbig" style="color:${e>=0?'var(--green)':'var(--red)'}">${e>=0?'+':''}${e.toFixed(1)}</div><div class="psub">edge vs break-even ${(impliedProb(odds)*100).toFixed(1)}%</div></div>`;
  }
  const glRows=rows.slice(0,25).map(r=>{
    const v=ml?(r.win?'W':'L'):val(r);
    const tag=r.ot==='OT'?' (OT)':(r.ot==='SO'?' (SO)':'');
    return `<tr><td>${fmtDate(r.game_date)}</td><td>${r.home_road==='H'?'vs':'@'} ${esc(r.opponent)}</td><td>${r.win?'W':'L'} ${r.rawFor}-${r.rawAg}${tag}</td><td style="text-align:right;font-weight:700;color:${hit(r)?'var(--green)':'var(--red)'}">${v}</td></tr>`;
  }).join('');
  const colHead=T.stat==='Team Total'?'Team goals':(T.stat==='Game Total'?'Game goals':'Result');
  $('pcard').innerHTML=`
    <div class="phead"><div><div class="pnm">${esc(T.tm)}</div><div class="muted small">Team trends · regular season only</div></div><button class="close" id="tClose">&times;</button></div>
    <div class="chips" id="tStats">${['Team Total','Game Total','Moneyline'].map(x=>`<button class="mc ${x===T.stat?'on':''}" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="ou">
      <div class="ourow"><span class="oul">${ml?'Wins':'Over'}</span><span class="oup" style="color:var(--green)">${n?(pct*100).toFixed(1)+'%':'--'}</span><span class="oun">${over}/${n}</span><span class="muted small" style="margin-left:6px;">${ml?`scores ${n?avg.toFixed(2):'--'} · allows ${n?avgOpp.toFixed(2):'--'}`:`avg ${n?avg.toFixed(2):'--'}`}</span>${!isNaN(odds)?`<span class="oupr">${fmtOdds(odds)}</span>`:''}</div>
    </div>
    ${n?svg:'<div class="chart2">'+lineCtl+'<div class="empty">No games match this filter.</div></div>'}
    <div class="chips" id="tWins" style="margin-top:12px;">${['Last 5','Last 10','Last 20','Season','All-time'].map(x=>`<button class="mc ${x===T.window&&!T.vs?'on':''}" data-v="${x}" ${T.vs?'disabled':''}>${x}</button>`).join('')}</div>
    ${T.vs?`<div class="muted small" style="margin-top:6px;">Showing every ${esc(T.vs)} meeting on file. Timeframe is ignored.</div>`:''}
    <div class="flab">Venue</div>
    <div class="chips" id="tSplits">${[['Home+Away','All games'],['Home','Home'],['Away','Away']].map(([v,t])=>`<button class="mc ${v===T.split?'on':''}" data-v="${v}">${t}</button>`).join('')}</div>
    <div class="flab">Opponent</div>
    <div class="chips" id="tVsC"><button class="mc ${!T.vs?'on':''}" data-v="">Any</button>${T.todayOpp?`<button class="mc ${T.vs===T.todayOpp?'on':''}" data-v="${esc(T.todayOpp)}">vs ${esc(T.todayOpp)} (tonight)</button>`:''}
      <select id="tVs" class="mini"><option value="">Other team…</option>${opps.filter(o=>o!==T.todayOpp).map(o=>`<option ${o===T.vs?'selected':''}>${o}</option>`).join('')}</select></div>
    <div style="font-weight:700;font-size:14px;margin:16px 0 2px;">Gamelog</div>
    <div class="muted small" style="margin-bottom:6px;">${T.vs?`Every ${esc(T.vs)} meeting we have on file (regular season, ${n} games)`:'Regular season only. Shootout goals are not counted in team or game totals.'}</div>
    <div style="overflow-x:auto;"><table class="gl"><thead><tr><th>Date</th><th>Vs</th><th>Score</th><th style="text-align:right">${colHead}</th></tr></thead><tbody>${glRows}</tbody></table></div>`;
  $('tClose').onclick=closePlayer;
  document.querySelectorAll('#tStats .mc').forEach(b=>b.onclick=()=>{ T.stat=b.dataset.v; T.line=T_LINES[T.stat]; drawTeam(); });
  document.querySelectorAll('#tWins .mc').forEach(b=>b.onclick=()=>{ T.window=b.dataset.v; drawTeam(); });
  document.querySelectorAll('#tSplits .mc').forEach(b=>b.onclick=()=>{ T.split=b.dataset.v; drawTeam(); });
  document.querySelectorAll('#tVsC .mc').forEach(b=>b.onclick=()=>{ T.vs=b.dataset.v; drawTeam(); });
  $('tVs').onchange=e=>{ T.vs=e.target.value; drawTeam(); };
  if(!ml){ $('tMinus').onclick=()=>{ T.line=Math.max(0.5,T.line-1); drawTeam(); }; $('tPlus').onclick=()=>{ T.line=T.line+1; drawTeam(); }; }
}

      let d=etToday();
      if(!S.games.some(g=>g.game_date===d)){
        const later=S.games.filter(g=>g.game_date>=d).map(g=>g.game_date).sort()[0];
        const earlier=S.games.filter(g=>g.game_date<d).map(g=>g.game_date).sort().pop();
        d=later||earlier||d;
      }
      S.day=d;
    }
    S.autoDay=etToday();
    $('dayLabel').textContent=new Date(S.day+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    await loadDay();
    setUpdated();
    render();
  }catch(e){
    $('updated').textContent='Offline';
    $('view').innerHTML=`<div class="err">Couldn't reach the database (${esc(e.message)}). Check your connection and tap Refresh.</div>`;
  }
}
init();
</script>
</body>
</html>
