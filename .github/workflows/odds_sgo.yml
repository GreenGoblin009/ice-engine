name: Daily player odds (SportsGameOdds)

on:
  schedule:
    # Eastern run times, all year: 9:00 AM, 11:30 AM, 4:00 PM, 7:00 PM. The early
    # two are for Saturday and Sunday afternoon games. Each run only asks for
    # games that haven't started, so late runs cost almost nothing.
    # Every time is listed at both UTC hours it can fall on (EDT / EST); the
    # script works out which is right today and the twin exits at once.
    - cron: "0 13 * * *"   #  9:00 AM EDT
    - cron: "0 14 * * *"   #  9:00 AM EST
    - cron: "30 15 * * *"  # 11:30 AM EDT
    - cron: "30 16 * * *"  # 11:30 AM EST
    - cron: "0 20 * * *"   #  4:00 PM EDT
    - cron: "0 21 * * *"   #  4:00 PM EST
    - cron: "0 23 * * *"   #  7:00 PM EDT
    - cron: "0 0 * * *"    #  7:00 PM EST
  workflow_dispatch:       # manual run: no time gate

permissions:
  contents: read

concurrency:
  group: daily-odds-sgo
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull FanDuel and DraftKings player odds and save to Supabase
        env:
          SPORTSGAMEODDS_KEY: ${{ secrets.SPORTSGAMEODDS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule }}  # empty on a manual run
        run: python ice_engine_odds_sgo.py --require-supabase --only-at "09:00,11:30,16:00,19:00"
      - name: Keep the raw JSON for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-odds-sgo
          path: daily_odds_sgo.json
          if-no-files-found: ignore
          retention-days: 14
