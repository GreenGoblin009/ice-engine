name: Auto picks

on:
  schedule:
    # 3:30 PM and 4:45 PM ET (both UTC hours; the script itself decides whether it is time).
    - cron: "30 19 * * *"
    - cron: "30 20 * * *"
    - cron: "45 20 * * *"
    - cron: "45 21 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Slate report"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: auto-picks
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's picks (once per day, only with fresh lineups and prices)
        run: python tools/auto_picks.py
      - name: Commit if posted
        run: |
          git add picks/picks.json
          if git diff --cached --quiet; then
            echo "Nothing posted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Post picks $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
