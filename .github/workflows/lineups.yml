name: Daily projected lineups

on:
  schedule:
    # Wanted run times, US Eastern, all year: 12, 2, 4, 6, 8 and 10 PM.
    # GitHub cron is UTC-only and ignores daylight saving, so every time is
    # listed at both UTC hours it can fall on (EDT = UTC-4, EST = UTC-5). The
    # script works out which of each pair is right today and the other one
    # exits within seconds. Keep one time per line: the script reads the
    # line that fired to know which run it is.
    - cron: "0 16 * * *"  # 12 PM EDT
    - cron: "0 17 * * *"  # 12 PM EST
    - cron: "0 18 * * *"  #  2 PM EDT
    - cron: "0 19 * * *"  #  2 PM EST
    - cron: "0 20 * * *"  #  4 PM EDT
    - cron: "0 21 * * *"  #  4 PM EST
    - cron: "0 22 * * *"  #  6 PM EDT
    - cron: "0 23 * * *"  #  6 PM EST
    - cron: "0 0 * * *"   #  8 PM EDT
    - cron: "0 1 * * *"   #  8 PM EST
    - cron: "0 2 * * *"   # 10 PM EDT
    - cron: "0 3 * * *"   # 10 PM EST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-lineups
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read NHL.com projected lineups and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule }}  # empty on a manual run
        run: >
          python ice_engine_lineups.py --require-supabase
          --only-at "12:00,14:00,16:00,18:00,20:00,22:00"

      - name: Keep the raw JSON for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-lineups
          path: daily_lineups.json
          if-no-files-found: ignore
          retention-days: 14
