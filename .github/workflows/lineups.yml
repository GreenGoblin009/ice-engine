name: Daily projected lineups

on:
  schedule:
    # Wanted run times, US Eastern, all year: every 30 minutes from 11:00 AM
    # to 4:30 PM, then every 15 minutes from 5:00 PM to 7:15 PM. Nothing
    # outside those windows.
    # GitHub cron is UTC-only and ignores daylight saving, so every time is
    # listed at both UTC hours it can fall on (EDT = UTC-4, EST = UTC-5). The
    # script works out which of each pair is right today and the other one
    # exits within seconds. Keep one time per line: the script reads the
    # line that fired to know which run it is.
    - cron: "0 15 * * *"    # 11:00 AM EDT
    - cron: "30 15 * * *"   # 11:30 AM EDT
    - cron: "0 16 * * *"    # 11:00 AM EST / 12:00 PM EDT
    - cron: "30 16 * * *"   # 11:30 AM EST / 12:30 PM EDT
    - cron: "0 17 * * *"    # 12:00 PM EST /  1:00 PM EDT
    - cron: "30 17 * * *"   # 12:30 PM EST /  1:30 PM EDT
    - cron: "0 18 * * *"    #  1:00 PM EST /  2:00 PM EDT
    - cron: "30 18 * * *"   #  1:30 PM EST /  2:30 PM EDT
    - cron: "0 19 * * *"    #  2:00 PM EST /  3:00 PM EDT
    - cron: "30 19 * * *"   #  2:30 PM EST /  3:30 PM EDT
    - cron: "0 20 * * *"    #  3:00 PM EST /  4:00 PM EDT
    - cron: "30 20 * * *"   #  3:30 PM EST /  4:30 PM EDT
    - cron: "0 21 * * *"    #  4:00 PM EST /  5:00 PM EDT
    - cron: "15 21 * * *"   #  5:15 PM EDT
    - cron: "30 21 * * *"   #  4:30 PM EST /  5:30 PM EDT
    - cron: "45 21 * * *"   #  5:45 PM EDT
    - cron: "0 22 * * *"    #  5:00 PM EST /  6:00 PM EDT
    - cron: "15 22 * * *"   #  5:15 PM EST /  6:15 PM EDT
    - cron: "30 22 * * *"   #  5:30 PM EST /  6:30 PM EDT
    - cron: "45 22 * * *"   #  5:45 PM EST /  6:45 PM EDT
    - cron: "0 23 * * *"    #  6:00 PM EST /  7:00 PM EDT
    - cron: "15 23 * * *"   #  6:15 PM EST /  7:15 PM EDT
    - cron: "30 23 * * *"   #  6:30 PM EST
    - cron: "45 23 * * *"   #  6:45 PM EST
    - cron: "0 0 * * *"     #  7:00 PM EST
    - cron: "15 0 * * *"    #  7:15 PM EST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-lineups
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read NHL.com projected lineups and save to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SCHEDULE_CRON: ${{ github.event.schedule }}  # empty on a manual run
        run: >
          python ice_engine_lineups.py --require-supabase
          --only-at "11:00,11:30,12:00,12:30,13:00,13:30,14:00,14:30,15:00,15:30,16:00,16:30,17:00,17:15,17:30,17:45,18:00,18:15,18:30,18:45,19:00,19:15"

      - name: Keep the raw JSON for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-lineups
          path: daily_lineups.json
          if-no-files-found: ignore
          retention-days: 14
