name: Settle picks

on:
  schedule:
    # Every 30 minutes through the game window (about 6 PM to 4 AM Eastern,
    # both daylight and standard time) so results land on the tab as games
    # finish. Plus a 6 AM ET sweep for anything late. Runs with nothing
    # pending change nothing and commit nothing.
    - cron: "*/30 23,0-8 * * *"
    - cron: "0 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-picks
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Settle pending legs from final box scores
        run: python tools/settle_picks.py

      - name: Commit if anything was settled
        run: |
          git add picks/picks.json
          if git diff --cached --quiet; then
            echo "Nothing settled; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Settle picks $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
          exit 1
