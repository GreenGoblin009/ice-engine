name: Projection scoreboard

on:
  schedule:
    # 7:30 AM ET (11:30 UTC) and 6:30 AM ET in winter: once a day after the last game finishes
    - cron: "30 10,11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scoreboard
  cancel-in-progress: false

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the scoreboard
        run: python tools/scoreboard.py

      - name: Commit if it changed
        run: |
          git config user.name "ice-engine-bot"
          git config user.email "ice-engine-bot@users.noreply.github.com"
          git add reports/scoreboard.md reports/scoreboard_rows.csv
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "Projection scoreboard $(date -u +%F)"
          git pull --rebase -q
          git push
