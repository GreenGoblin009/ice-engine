name: Pattern backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pattern-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the pattern backtest (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python tools/pattern_backtest.py
      - name: Commit the report if it changed
        run: |
          git add reports/pattern_backtest.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pattern backtest $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 10))
          done
          exit 1
